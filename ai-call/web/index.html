<!DOCTYPE html>
<html lang="uz"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>StarsFuel Support</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg0:#0b120a;--bg1:#14240f;--acc:#8AAC62;--acc2:#A6D06A;--txt:#f3f6ef;--mut:#9aa695;--red:#e5484d;
 --app:radial-gradient(120% 70% at 50% 18%,#26421a 0%,#14240f 38%,#0b120a 78%);--core:linear-gradient(145deg,#2c4a1e,#16260f);
 --key:rgba(255,255,255,.1);--keyon:rgba(255,255,255,.28);--keytx:#fff;--keybd:transparent;--keysh:none;--keyfx:none;
 --btn:rgba(255,255,255,.1);--btntx:#fff;--ai:rgba(166,208,106,.12);--aibd:rgba(166,208,106,.22);--hfont:Inter,system-ui,sans-serif;--glow:none}
/* 2 Glass: chuqur ko'k, muzli shisha */
[data-theme=glass]{--bg0:#0a0f1f;--acc:#7cc4ff;--acc2:#9fd4ff;--mut:#a3adc8;
 --app:radial-gradient(60% 40% at 15% 20%,#3b2a8a 0%,transparent 70%),radial-gradient(55% 40% at 90% 75%,#0f6b8f 0%,transparent 70%),linear-gradient(#0b1024,#070a16);
 --core:rgba(255,255,255,.08);--key:rgba(255,255,255,.07);--keyon:rgba(255,255,255,.22);--keybd:rgba(255,255,255,.16);--keyfx:blur(14px) saturate(160%);
 --btn:rgba(255,255,255,.1);--ai:rgba(124,196,255,.1);--aibd:rgba(124,196,255,.25)}
/* 3 Light: oq, toza */
[data-theme=light]{--bg0:#f3f5ef;--txt:#141a12;--mut:#6b7466;--acc:#6f9a45;--acc2:#4f7f27;
 --app:linear-gradient(180deg,#ffffff 0%,#eef2e8 100%);--core:linear-gradient(145deg,#5f8a3a,#2f4f1c);
 --key:#fff;--keyon:#e3ead9;--keytx:#141a12;--keybd:rgba(20,26,18,.06);--keysh:0 6px 16px rgba(30,45,20,.08);
 --btn:#e7ece1;--btntx:#141a12;--ai:#fff;--aibd:rgba(20,26,18,.08)}
/* 4 Neon: qora + yashil chiziq */
[data-theme=neon]{--bg0:#000;--acc:#A6FF3A;--acc2:#A6FF3A;--mut:#6f7b66;
 --app:radial-gradient(70% 35% at 50% 22%,rgba(166,255,58,.14),transparent 70%),#000;--core:#000;
 --key:transparent;--keyon:rgba(166,255,58,.18);--keytx:#d8ffb0;--keybd:rgba(166,255,58,.55);--keysh:0 0 14px rgba(166,255,58,.18) inset;
 --btn:transparent;--btntx:#d8ffb0;--ai:rgba(166,255,58,.07);--aibd:rgba(166,255,58,.35);--hfont:'JetBrains Mono',ui-monospace,monospace;--glow:0 0 12px rgba(166,255,58,.7)}
/* 5 Gold: qora + Stars oltini */
[data-theme=gold]{--bg0:#0c0a07;--acc:#E8B64C;--acc2:#F5CF73;--txt:#fbf4e4;--mut:#a89a7c;
 --app:radial-gradient(90% 55% at 50% 0%,#3a2a0e 0%,#16110a 55%,#0c0a07 100%);--core:linear-gradient(145deg,#2b2112,#120d07);
 --key:linear-gradient(160deg,rgba(245,207,115,.14),rgba(245,207,115,.04));--keyon:rgba(245,207,115,.3);--keytx:#fbf4e4;--keybd:rgba(245,207,115,.28);
 --btn:rgba(245,207,115,.12);--btntx:#F5CF73;--ai:rgba(232,182,76,.1);--aibd:rgba(232,182,76,.28);--hfont:'Playfair Display',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg0);color:var(--txt);font-family:Inter,system-ui,sans-serif;overflow:hidden;user-select:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 48px) 24px calc(env(safe-area-inset-bottom) + 34px);
 background:var(--app)}
.who{margin-top:4vh;text-align:center}
.av{position:relative;width:132px;height:132px;margin:0 auto 22px}
.av .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--acc);opacity:0}
.av .core{position:absolute;inset:0;border-radius:50%;background:var(--core);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 1px rgba(166,208,106,.25),0 20px 50px rgba(0,0,0,.5)}
.av svg{width:64px;height:64px}
.ringing .ring{animation:pulse 1.6s infinite}.ringing .ring.r2{animation-delay:.53s}.ringing .ring.r3{animation-delay:1.06s}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
h1{margin:0;font-family:var(--hfont);font-size:28px;font-weight:700;letter-spacing:-.02em}
#status{margin-top:8px;font-size:16px;color:var(--mut);font-variant-numeric:tabular-nums;min-height:20px}
#sub{flex:1;width:100%;max-width:520px;display:flex;flex-direction:column;justify-content:flex-end;gap:8px;padding:18px 0;overflow:hidden;mask-image:linear-gradient(transparent,#000 30%)}
.ln{font-size:15px;line-height:1.4;padding:9px 13px;border-radius:16px;max-width:86%;animation:in .25s ease}
.ln.ai{align-self:flex-start;background:var(--ai);border:1px solid var(--aibd)}
.ln.user{align-self:flex-end;background:rgba(255,255,255,.08)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
#sub.off{display:none}
#pad{flex:1;display:grid;grid-template-columns:repeat(3,62px);gap:12px 24px;align-content:center;justify-content:center;padding:10px 0}
#pad button{width:62px;height:62px;border-radius:50%;border:1px solid var(--keybd);background:var(--key);box-shadow:var(--keysh);backdrop-filter:var(--keyfx);-webkit-backdrop-filter:var(--keyfx);color:var(--keytx);text-shadow:var(--glow);font:500 25px var(--hfont);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;cursor:pointer}
#pad button small{font-family:Inter,system-ui;font-size:8px;letter-spacing:1.6px;text-shadow:none;color:var(--mut);margin-top:3px;font-weight:600}
#pad button:active{background:var(--keyon)}
.st{font-size:13px;color:var(--acc2);height:18px;text-align:center;margin-bottom:14px;letter-spacing:.02em}
.ctrl{display:flex;gap:26px;justify-content:center;align-items:flex-end}
.b{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.b button{width:64px;height:64px;border-radius:50%;border:0;background:var(--btn);border:1px solid var(--keybd);color:var(--btntx);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s,background .2s}
.b button:active{transform:scale(.93)}.b button.on{background:#fff;color:#0b120a}
.b button svg{width:28px;height:28px}
#hang{width:72px;height:72px;background:var(--red)}
#call{width:76px;height:76px;background:#30c158;animation:bob 1.8s infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.hide{display:none!important}
#err{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 130px);padding:12px 14px;border-radius:14px;background:rgba(229,72,77,.15);border:1px solid rgba(229,72,77,.4);font-size:14px;text-align:center}
#lat{position:fixed;top:8px;right:10px;font-size:11px;color:#5d6b58}
[data-theme=neon] .av .core{box-shadow:0 0 0 1px var(--acc),0 0 30px rgba(166,255,58,.35)}[data-theme=light] .av .core{box-shadow:0 12px 30px rgba(30,45,20,.12)}[data-theme=light] #lat{color:#aaa}
</style></head>
<body><div id="app">
 <div class="who">
  <div class="av" id="av"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div>
   <div class="core" id="core"><img src="/static/logo.png" alt="" style="width:76px;height:76px"></div></div>
  <h1>StarsFuel Support</h1>
  <div id="status">AI qo'llab-quvvatlash</div>
 </div>
 <div id="sub"></div>
 <div id="pad" class="hide"></div>
 <div class="st" id="st"></div>
 <div class="ctrl" id="pre"><div class="b"><button id="call" aria-label="Qo'ng'iroq qilish"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button>Qo'ng'iroq qilish</div></div>
 <div class="ctrl hide" id="inc">
  <div class="b"><button id="mute" aria-label="Mikrofon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>Ovozsiz</div>
  <div class="b"><button id="hang" aria-label="Tugatish"><svg viewBox="0 0 24 24" fill="currentColor" style="transform:rotate(135deg)"><path d="M6.6 10.8a15.1 15.1 0 006.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 013 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></button>Tugatish</div>
  <div class="b"><button id="kp" aria-label="Klaviatura"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="6" cy="5" r="1.7"/><circle cx="12" cy="5" r="1.7"/><circle cx="18" cy="5" r="1.7"/><circle cx="6" cy="11" r="1.7"/><circle cx="12" cy="11" r="1.7"/><circle cx="18" cy="11" r="1.7"/><circle cx="6" cy="17" r="1.7"/><circle cx="12" cy="17" r="1.7"/><circle cx="18" cy="17" r="1.7"/><circle cx="12" cy="22" r="1.7"/></svg></button>Klaviatura</div>
 </div>
 <div id="err" class="hide"></div><div id="lat"></div>
</div>
<script>
const QS = new URLSearchParams(location.search);
const THEME = QS.get('theme') || document.documentElement.dataset.theme || 'green';
document.documentElement.dataset.theme = THEME;
const BG0 = getComputedStyle(document.documentElement).getPropertyValue('--bg0').trim() || '#0b120a';
const tg = window.Telegram && Telegram.WebApp; if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor(BG0); tg.setBackgroundColor && tg.setBackgroundColor(BG0); }
const $ = id => document.getElementById(id);
const hap = t => { try { tg.HapticFeedback.impactOccurred(t || 'light') } catch (e) {} };
let ctx, ws, mic, micNode, player, ringOsc, ringTimer, t0, timerI, seq = 0, muted = false, state = 'idle', lastUserEl = null;

function setStatus(s) { $('status').textContent = s; }
function line(role, text) {
  if (role === 'user' && lastUserEl && lastUserEl.dataset.open === '1') { lastUserEl.textContent = text; return; }
  const d = document.createElement('div'); d.className = 'ln ' + role; d.textContent = text; $('sub').appendChild(d);
  if (role === 'user') { d.dataset.open = '1'; lastUserEl = d; } else if (lastUserEl) lastUserEl.dataset.open = '0';
  while ($('sub').children.length > 8) $('sub').firstChild.remove();
}
function err(t) { $('err').textContent = t; $('err').classList.remove('hide'); }

function startRing(onceSec) {  // 425 Hz: one long 'duuud' (onceSec) or ringback 1 s on / 3 s off
  stopRing();
  const g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
  ringOsc = ctx.createOscillator(); ringOsc.frequency.value = 425; ringOsc.connect(g); ringOsc.start();
  const beat = (len) => { const t = ctx.currentTime; g.gain.setTargetAtTime(.07, t, .01); g.gain.setTargetAtTime(0, t + len, .02); };
  if (onceSec) { beat(onceSec); return; }
  beat(1); ringTimer = setInterval(() => beat(1), 4000);
}
const DT = { '1': [697, 1209], '2': [697, 1336], '3': [697, 1477], '4': [770, 1209], '5': [770, 1336], '6': [770, 1477], '7': [852, 1209], '8': [852, 1336], '9': [852, 1477], '*': [941, 1209], '0': [941, 1336], '#': [941, 1477] };
function dtmfTone(d) {
  if (!ctx) return; const g = ctx.createGain(); g.gain.value = .06; g.connect(ctx.destination); const t = ctx.currentTime;
  DT[d].forEach(f => { const o = ctx.createOscillator(); o.frequency.value = f; o.connect(g); o.start(t); o.stop(t + .16); });
}
const KEYS = [['1', ''], ['2', 'ABC'], ['3', 'DEF'], ['4', 'GHI'], ['5', 'JKL'], ['6', 'MNO'], ['7', 'PQRS'], ['8', 'TUV'], ['9', 'WXYZ'], ['*', ''], ['0', '+'], ['#', '']];
$('pad').innerHTML = KEYS.map(([d, l]) => `<button data-d="${d}">${d}<small>${l || '&nbsp;'}</small></button>`).join('');
$('pad').onclick = e => { const b = e.target.closest('button'); if (!b) return; const d = b.dataset.d; dtmfTone(d); hap('light');
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'dtmf', digit: d })); };
function showPad(on) { $('pad').classList.toggle('hide', !on); $('sub').classList.toggle('off', on); $('kp').classList.toggle('on', on); }
function stopRing() { clearInterval(ringTimer); try { ringOsc.stop() } catch (e) {} ringOsc = null; }

async function call() {
  hap('medium');
  $('pre').classList.add('hide'); $('inc').classList.remove('hide'); $('av').classList.add('ringing');
  setStatus("Qo'ng'iroq qilinmoqda…");
  try {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    await ctx.resume();
    mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true, channelCount: 1 } });
  } catch (e) { err("Mikrofonga ruxsat bering va qayta urinib ko'ring."); setStatus('Mikrofon yoqilmagan'); $('av').classList.remove('ringing'); return reset(); }
  await ctx.audioWorklet.addModule('/static/audio-worklets.js');
  // playback goes through an <audio> element so the browser echo canceller hears it
  player = new AudioWorkletNode(ctx, 'pcm-player', { outputChannelCount: [1] });
  const dest = ctx.createMediaStreamDestination(); player.connect(dest);
  const el = new Audio(); el.srcObject = dest.stream; el.autoplay = true; el.playsInline = true; await el.play().catch(() => player.connect(ctx.destination));
  player.port.onmessage = e => {
    if (e.data.idle && ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'idle', seq }));
  };
  const src = ctx.createMediaStreamSource(mic);
  micNode = new AudioWorkletNode(ctx, 'mic-capture');
  src.connect(micNode);
  micNode.port.onmessage = e => { if (!muted && ws && ws.readyState === 1 && !['ringing', 'menu', 'menu_done', 'transfer'].includes(state)) ws.send(e.data); };
  const q = new URLSearchParams({ initData: tg ? tg.initData : '' });
  ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?' + q);
  ws.binaryType = 'arraybuffer';
  ws.onmessage = ev => {
    if (typeof ev.data !== 'string') { player.port.postMessage(ev.data, [ev.data]); return; }
    const m = JSON.parse(ev.data);
    if (m.type === 'state') onState(m.state);
    else if (m.type === 'seq') seq = m.seq;
    else if (m.type === 'clear') player.port.postMessage('clear');
    else if (m.type === 'transcript') line(m.role, m.text);
    else if (m.type === 'metrics') console.log('latency', m);
    else if (m.type === 'error') err(m.message || 'Xatolik');
  };
  ws.onclose = () => { if (state !== 'ended') onState('ended'); };
}

function onState(s) {
  state = s;
  const lbl = { listening: 'Tinglayapman…', thinking: "O'ylayapman…", menu: 'Raqamni tanlang', transfer: 'Operatorga ulanmoqda…' };
  $('st').textContent = lbl[s] ?? '';
  if (s === 'ringing') startRing(1.4);
  if (s === 'menu') {
    stopRing(); hap('heavy'); $('av').classList.remove('ringing'); showPad(true); t0 = Date.now();
    timerI = setInterval(() => { const x = Math.floor((Date.now() - t0) / 1000); setStatus(String(Math.floor(x / 60)).padStart(2, '0') + ':' + String(x % 60).padStart(2, '0')); }, 500);
    setStatus('00:00');
  }
  if (s === 'menu_done') showPad(false);
  if (s === 'transfer') { $('av').classList.add('ringing'); startRing(); }
  if (s === 'connected') { stopRing(); hap('heavy'); $('av').classList.remove('ringing'); showPad(false); }
  if (s === 'ended') {
    stopRing(); clearInterval(timerI); setStatus("Qo'ng'iroq tugadi"); $('st').textContent = ''; hap('medium');
    try { ws && ws.close() } catch (e) {}
    setTimeout(reset, 1800);
  }
}
function reset() {
  try { mic && mic.getTracks().forEach(t => t.stop()) } catch (e) {}
  try { ctx && ctx.close() } catch (e) {}
  ws = null; ctx = null; state = 'idle'; muted = false; $('mute').classList.remove('on');
  $('inc').classList.add('hide'); $('pre').classList.remove('hide'); showPad(false); $('sub').innerHTML = ''; lastUserEl = null;
  setStatus("AI qo'llab-quvvatlash");
}
$('call').onclick = call;
if (QS.get('preview') === 'menu') { $('pre').classList.add('hide'); $('inc').classList.remove('hide'); showPad(true); setStatus('00:07'); $('st').textContent = 'Raqamni tanlang'; }
if (QS.get('preview') === 'talk') { $('pre').classList.add('hide'); $('inc').classList.remove('hide'); setStatus('01:24');
  line('ai', "Assalomu alaykum, men Madina. Sizga qanday yordam bera olaman?"); line('user', 'Yuz stars qancha turadi?'); line('ai', "Yuz stars yigirma ikki ming so'm turadi."); }
$('hang').onclick = () => { hap('heavy'); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'hangup' })); onState('ended'); };
$('mute').onclick = () => { muted = !muted; $('mute').classList.toggle('on', muted); hap(); if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'mute', on: muted })); };
$('kp').onclick = () => { hap(); showPad($('pad').classList.contains('hide')); };
</script></body></html>
