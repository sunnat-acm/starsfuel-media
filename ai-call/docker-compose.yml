services:
  call:
    build: .
    restart: unless-stopped
    env_file: .env
    expose: ["8000"]
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [call]
volumes:
  caddy_data:
