<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}body{font:15px -apple-system,system-ui,sans-serif;background:#141018;color:#fff;padding:14px}
.top{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}.top i{font-style:normal;margin-left:auto;font-size:11px;font-weight:700;color:#0c0a10;background:#34c759;border-radius:8px;padding:3px 8px}
.tabs{display:flex;gap:6px;margin:12px 0;background:#231d29;border-radius:12px;padding:4px}
.tabs b{flex:1;text-align:center;padding:8px 0;border-radius:9px;font-size:13px;color:#aaa;cursor:pointer}.tabs b.on{background:#EC5A9A;color:#fff}
.box{background:#1d1822;border-radius:14px;padding:14px}
.big{font-size:30px;font-weight:800;letter-spacing:-1px}.sm{font-size:12px;color:#9a93a3;margin-top:2px}
input{width:100%;margin:14px 0 4px;accent-color:#EC5A9A}
.row{display:flex;gap:6px;margin-top:8px}.row b{flex:1;text-align:center;font-size:12px;padding:7px 0;border-radius:9px;background:#2a2330;cursor:pointer}
.row b.on{background:#5b2a44;color:#ffb3d4}
.sum{margin-top:12px;display:flex;justify-content:space-between;align-items:baseline;border-top:1px dashed #3a3240;padding-top:10px}
.sum .big{color:#5BE584}.foot{margin-top:10px;font-size:11px;color:#8a8392;text-align:center}
</style></head><body>
<div class="top">⭐ StarsFuel kalkulyator<i>FAOL</i></div>
<div class="tabs"><b class="on" data-t="s">Stars</b><b data-t="p">Premium</b><b data-t="n">Raqam</b></div>
<div class="box" id="b"></div>
<div class="foot">Buyurtma: @StarsFuelApp</div>
<script>
var T='s',S=100,M=1,f=function(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')};
var P={1:45000,3:190000,6:250000,12:400000};
function r(){var b=document.getElementById('b'),h='';
if(T=='s'){h='<div class="big">'+f(S)+' ⭐</div><div class="sm">Telegram Stars miqdori</div><input type="range" min="50" max="5000" step="50" value="'+S+'" id="r">'+
'<div class="row">'+[50,100,500,1000].map(function(v){return '<b data-s="'+v+'" class="'+(v==S?'on':'')+'">'+v+'</b>'}).join('')+'</div>'+
'<div class="sum"><span class="sm">Narxi</span><span class="big">'+f(S*220)+' so\'m</span></div>'}
else if(T=='p'){h='<div class="big">Premium</div><div class="sm">Muddatni tanlang</div><div class="row">'+[1,3,6,12].map(function(v){return '<b data-m="'+v+'" class="'+(v==M?'on':'')+'">'+v+' oy</b>'}).join('')+'</div>'+
'<div class="sum"><span class="sm">'+(M==1?'Admin orqali':'Narxi')+'</span><span class="big">'+f(P[M])+' so\'m</span></div>'}
else{h='<div class="big">📱 Telegram raqam</div><div class="sm">Yangi akkaunt uchun, turli davlatlar</div><div class="sum"><span class="sm">Narxi</span><span class="big">10 000 so\'m</span></div>'}
b.innerHTML=h;var i=document.getElementById('r');if(i)i.oninput=function(){S=+i.value;r();document.getElementById('r').focus()}}
document.onclick=function(e){var d=e.target.dataset;if(d.t){T=d.t;[].forEach.call(document.querySelectorAll('.tabs b'),function(x){x.className=x.dataset.t==T?'on':''})}
if(d.s)S=+d.s;if(d.m)M=+d.m;if(d.t||d.s||d.m)r()};r();
</script></body></html>
