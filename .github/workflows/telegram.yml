name: Telegram kanalga post
on:
  push:
    paths: ["telegram/queue/**"]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: telegram-post
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Navbatdagi postlarni yuborish
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT: "@starsFuel"
        run: python telegram/post.py
      - name: Yuborilganlarni belgilash
        run: |
          git config user.name "starsfuel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A telegram
          git diff --cached --quiet || (git commit -m "Telegram: yuborilgan postlar" && git push)
