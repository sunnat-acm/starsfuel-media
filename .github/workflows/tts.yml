name: tts
on:
  push:
    paths: ['tts/queue/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install edge-tts
      - name: synth
        run: |
          set -e
          for f in tts/queue/*.json; do
            [ -e "$f" ] || continue
            n=$(basename "$f" .json)
            python - "$f" "$n" <<'PY'
          import json,sys,subprocess
          p=json.load(open(sys.argv[1]));n=sys.argv[2]
          cmd=['edge-tts','--voice',p.get('voice','uz-UZ-SardorNeural'),'--rate',p.get('rate','+0%'),'--pitch',p.get('pitch','+0Hz'),'--text',p['text'],'--write-media',f'tts/out/{n}.mp3','--write-subtitles',f'tts/out/{n}.srt']
          subprocess.run(cmd,check=True)
          PY
            git rm -q "$f"
          done
          edge-tts --list-voices | grep -i uz- > tts/voices.txt || true
      - name: commit
        if: always()
        run: |
          git config user.name tts-bot; git config user.email tts-bot@users.noreply.github.com
          git add -A tts; git commit -m "tts: synth" || exit 0; git pull --rebase; git push
