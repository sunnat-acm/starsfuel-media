name: ai-call-e2e
on:
  workflow_dispatch:
    inputs:
      llm: {description: 'deepseek or mock', default: 'deepseek'}
      stt: {description: 'hybrid | groq | whisper | voicelab', default: 'hybrid'}
      tts: {description: 'edge | voicelab', default: 'edge'}
      wmodel: {description: 'local whisper model', default: 'small'}
permissions:
  contents: write
jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get install -y -qq ffmpeg >/dev/null; pip install -q -r ai-call/requirements.txt soundfile librosa
      - name: navai model cache
        uses: actions/cache@v4
        id: navai
        with:
          path: ai-call/models/navai-small-ct2
          key: navai-small-ct2-v1
      - name: convert NavAI Uzbek model
        if: steps.navai.outputs.cache-hit != 'true'
        run: |
          pip install -q torch --index-url https://download.pytorch.org/whl/cpu
          pip install -q transformers ctranslate2 sentencepiece
          cd ai-call && python tools/convert_navai.py navai-uz/whisper-small-uzbek models/navai-small-ct2
      - name: run call simulation
        timeout-minutes: 8
        env:
          VOICELAB_API_KEY: ${{ secrets.VOICELAB_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          STT_PROVIDER: ${{ github.event.inputs.stt }}
          TTS_PROVIDER: ${{ github.event.inputs.tts }}
          WHISPER_MODEL: ${{ github.event.inputs.wmodel }}
        run: |
          cd ai-call
          LLM=${{ github.event.inputs.llm }}; if [ -z "$DEEPSEEK_API_KEY" ]; then LLM=mock; fi
          (ALLOW_NO_AUTH=1 LLM_PROVIDER=$LLM python -m uvicorn server.app:app --port 8000 > /tmp/server.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf localhost:8000/health && break; sleep 3; done; echo
          python -u tests/sim_client.py ws://127.0.0.1:8000/ws \
            ../voicelab/out/q_uz1.wav@8 ../voicelab/out/q_uz2.wav@17 ../voicelab/out/q_ru1.wav@27 ../voicelab/out/q_uz3.wav@38 \
            --dur 48 --save tests/e2e_out.wav > tests/e2e_log.txt 2>&1 &
          SIM=$!; sleep 60; kill $SIM 2>/dev/null || true; sleep 1
          echo "LLM=$LLM STT=$STT_PROVIDER TTS=$TTS_PROVIDER W=$WHISPER_MODEL" >> tests/e2e_log.txt
          cat /tmp/server.log | grep -v "GET /health" | sed "s/${VOICELAB_API_KEY:-___}/***/g" >> tests/e2e_log.txt || true
      - name: commit
        if: always()
        run: |
          git config user.name e2e-bot; git config user.email e2e-bot@users.noreply.github.com
          git add -A ai-call/tests; git commit -m "ai-call: e2e run" || exit 0; git pull --rebase; git push
