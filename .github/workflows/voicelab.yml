name: voicelab
on:
  push:
    paths: ['voicelab/queue/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python voicelab/vl.py
        env:
          VOICELAB_API_KEY: ${{ secrets.VOICELAB_API_KEY }}
      - name: commit
        if: always()
        run: |
          git config user.name tts-bot; git config user.email tts-bot@users.noreply.github.com
          git add -A voicelab; git commit -m "voicelab: run" || exit 0; git pull --rebase; git push
