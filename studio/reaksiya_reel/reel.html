const P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x);          // expo out
const e3=x=>1-Math.pow(1-x,3);
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const L=(a,b,x)=>a+(b-a)*x;
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const IMG=n=>`icons/${n}.png`;
const ic=(n,x,y,s,extra='')=>`<img class="i" src="${IMG(n)}" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;${extra}">`;

function cap(text,t,t0,dur=.5,top=34,size=30){const w=text.split(' ');const n=w.length;
 return `<div class="cap" style="top:${top}px;font-size:${size}px">`+w.map((x,i)=>{const k=eo(P(t,t0+i*dur/n,t0+i*dur/n+.18));const c=Math.round(L(205,17,k));return `<span style="color:rgb(${c},${c},${c});opacity:${L(.0,1,cl(k*3))}">${x}</span>`}).join(' ')+'</div>'}

// D step 2: permission
[5.2,6.45,(t,s)=>{const R=['Xabarlarni joylash','Xabarlarni boshqarish','Xabarlarni o\'chirish','Hikoyalarni joylash'];const a=eo(P(t,s,s+.25));

  ${R.map((l,i)=>{const hot=i==1;const on=hot?io(P(t,s+.45,s+.65)):(i==0?1:0);return `<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 4px;border-bottom:1px solid #f4f4f4;${hot?'background:#FFF1F4;margin:0 -14px;padding:16px 18px;border-radius:12px':''}">

  return `<div style="width:96px;height:96px;border-radius:22px;background:${on>.5?'#FFF1F4':'#f4f4f6'};border:2px solid ${on>.5?PINK:'transparent'};display:flex;align-items:center;justify-content:center;position:relative;transform:scale(${L(.85,1,on)})">${E(e,50)}

[7.95,9.2,(t,s)=>{const a=eo(P(t,s+.05,s+.3)),b=eo(P(t,s+.5,s+.75));

[9.2,10.45,(t,s)=>{const u=eo(P(t,s+.15,s+.35)),r=eo(P(t,s+.6,s+.8));
