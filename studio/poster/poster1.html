<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:PF;font-weight:700;src:url(playfair-display-latin-700-normal.woff2)}
@font-face{font-family:PF;font-weight:900;src:url(playfair-display-latin-900-normal.woff2)}
@font-face{font-family:PF;font-weight:700;font-style:italic;src:url(playfair-display-latin-700-italic.woff2)}
@font-face{font-family:PF;font-weight:900;font-style:italic;src:url(playfair-display-latin-900-italic.woff2)}
@font-face{font-family:SM;font-weight:400;src:url(space-mono-latin-400-normal.woff2)}
@font-face{font-family:SM;font-weight:700;src:url(space-mono-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(inter-latin-900-normal.woff2)}
:root{--t:#B06750;--c:#F4EADB;--d:#3A1F16;--g:#F2B544}
html,body{margin:0}*{box-sizing:border-box}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--c);color:var(--d)}
.paper{position:absolute;inset:0;opacity:.5;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .4  0 0 0 0 .3  0 0 0 .22 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vign{position:absolute;inset:0;background:radial-gradient(90% 75% at 50% 50%,transparent 55%,rgba(120,70,40,.18))}
.top{position:absolute;left:70px;right:70px;top:58px;display:flex;justify-content:space-between;align-items:center;font-family:SM;font-size:20px;letter-spacing:3px}
.top .b{display:flex;align-items:center;gap:14px;font-family:I;font-weight:900;font-size:26px;letter-spacing:4px}
.top .b img{width:46px}
.rule{position:absolute;left:70px;right:70px;height:0;border-top:2px solid var(--d)}
.rule.d{border-top:1px solid var(--d)}
.h{position:absolute;left:62px;top:150px;font-family:PF;font-weight:900;font-size:212px;line-height:.86;letter-spacing:-.035em}
.h i{color:var(--t);font-weight:900}
.side{position:absolute;right:72px;top:178px;width:250px;font-family:SM;font-size:19px;line-height:1.5;text-align:right}
.side b{font-weight:700}
.note{position:absolute;width:880px;height:420px;border-radius:14px;overflow:hidden}
.note svg{position:absolute;inset:0}
.stamp{position:absolute}
.foot{position:absolute;left:70px;right:70px;bottom:58px;display:flex;justify-content:space-between;align-items:flex-end}
.foot .l{font-family:PF;font-style:italic;font-weight:700;font-size:40px;line-height:1.15;max-width:560px}
.ticket{position:relative;background:var(--d);color:var(--c);font-family:I;font-weight:900;font-size:36px;padding:26px 40px 26px 44px;border-radius:10px;letter-spacing:.5px;
 -webkit-mask:radial-gradient(circle 12px at 0 50%,transparent 11px,#000 12px) left/51% 100% no-repeat,radial-gradient(circle 12px at 100% 50%,transparent 11px,#000 12px) right/51% 100% no-repeat}
.ticket small{display:block;font-family:SM;font-weight:400;font-size:15px;letter-spacing:3px;opacity:.7;margin-bottom:4px}
</style></head><body>
<div class="s" id="s">
 <div class="paper"></div><div class="vign"></div>
 <div class="top"><div class="b"><img src="../../brand/logo_terracotta.svg">STARSFUEL</div><div>SERIYA SF · № 0000100</div></div>
 <div class="rule" style="top:128px"></div><div class="rule d" style="top:134px"></div>
 <div class="h">Yangi<br><i>valyuta.</i></div>
 <div class="side">Telegram'da sovg'a,<br>reaksiya va to'lov —<br>endi <b>yulduzlar</b> bilan.<br><br>Kurs: <b>100 ⭐ =<br>22 000 so'm</b></div>
 <div id="notes"></div>
 <div class="rule" style="bottom:196px"></div><div class="rule d" style="bottom:190px"></div>
 <div class="foot"><div class="l">Kartadan — to'g'ridan-to'g'ri<br>Telegram hisobingizga.</div>
  <div class="ticket"><small>KASSA</small>@StarsFuelBot</div></div>
</div>
<script>
const NS='http://www.w3.org/2000/svg';
const LOGO=fetch('../../brand/logo.svg').then(r=>r.text()).then(t=>t.match(/ d="([^"]+)"/)[1]);
// hypotrochoid rosette
function ros(cx,cy,R,r,d,turns,n=1400){let p='';for(let k=0;k<=n;k++){const t=k/n*Math.PI*2*turns;const x=cx+(R-r)*Math.cos(t)+d*Math.cos((R-r)/r*t),y=cy+(R-r)*Math.sin(t)-d*Math.sin((R-r)/r*t);p+=(k?'L':'M')+x.toFixed(1)+' '+y.toFixed(1)}return p}
// wavy band along a rect border
function band(w,h,inset,amp,freq,phase){let p='';const per=2*(w+h-4*inset),N=900;for(let k=0;k<=N;k++){const s=k/N*per;let x,y,nx,ny;const W=w-2*inset,H=h-2*inset;
 if(s<W){x=inset+s;y=inset;nx=0;ny=1}else if(s<W+H){x=w-inset;y=inset+s-W;nx=-1;ny=0}else if(s<2*W+H){x=w-inset-(s-W-H);y=h-inset;nx=0;ny=-1}else{x=inset;y=h-inset-(s-2*W-H);nx=1;ny=0}
 const o=amp*Math.sin(s/per*Math.PI*2*freq+phase);p+=(k?'L':'M')+(x+nx*o).toFixed(1)+' '+(y+ny*o).toFixed(1)}return p+'Z'}
function noteSVG(ink,paper,accent,logoD,serial){
 const w=880,h=420;let g='';
 g+=`<rect width="${w}" height="${h}" fill="${paper}"/>`;
 // fine background lines
 for(let i=0;i<60;i++){g+=`<path d="M0 ${i*7+2} C 220 ${i*7-12}, 660 ${i*7+16}, 880 ${i*7+2}" stroke="${ink}" stroke-opacity=".07" fill="none"/>`}
 // borders
 for(let k=0;k<6;k++)g+=`<path d="${band(w,h,22,7,64,k*0.55)}" stroke="${ink}" stroke-width="1" fill="none" opacity=".75"/>`;
 g+=`<rect x="40" y="40" width="${w-80}" height="${h-80}" rx="6" fill="none" stroke="${ink}" stroke-width="2"/>`;
 g+=`<rect x="46" y="46" width="${w-92}" height="${h-92}" rx="4" fill="none" stroke="${ink}" stroke-width=".8"/>`;
 // rosette left
 const cx=230,cy=210;
 g+=`<circle cx="${cx}" cy="${cy}" r="150" fill="${accent}" fill-opacity=".12"/>`;
 [[150,41,92,41],[150,37,78,37],[126,29,64,29],[96,17,46,17]].forEach(([R,r,d,t],i)=>g+=`<path d="${ros(cx,cy,R*0.95,r,d,t)}" stroke="${i%2?accent:ink}" stroke-width=".7" fill="none" opacity=".85"/>`);
 g+=`<circle cx="${cx}" cy="${cy}" r="58" fill="${ink}"/><circle cx="${cx}" cy="${cy}" r="52" fill="none" stroke="${paper}" stroke-width="1"/>`;
 g+=`<g transform="translate(${cx-40} ${cy-40}) scale(${80/512})"><path d="${logoD}" fill="${paper}" fill-rule="evenodd"/></g>`;
 // right side text
 g+=`<text x="818" y="150" text-anchor="end" font-family="PF" font-weight="900" font-size="150" fill="${ink}">100</text>`;
 g+=`<text x="818" y="200" text-anchor="end" font-family="I" font-weight="900" font-size="30" letter-spacing="7" fill="${accent}">TELEGRAM STARS</text>`;
 g+=`<text x="818" y="240" text-anchor="end" font-family="PF" font-style="italic" font-weight="700" font-size="30" fill="${ink}">yuz yulduz</text>`;
 // microtext line
 let micro='';for(let i=0;i<14;i++)micro+='STARSFUEL · ';
 g+=`<text x="420" y="292" font-family="SM" font-size="9" letter-spacing="1.5" fill="${ink}" opacity=".7">${micro}</text>`;
 g+=`<line x1="420" y1="300" x2="818" y2="300" stroke="${ink}" stroke-width="1"/>`;
 g+=`<text x="420" y="345" font-family="SM" font-weight="700" font-size="26" letter-spacing="4" fill="${accent}">${serial}</text>`;
  // corner numerals
 g+=`<text x="70" y="96" font-family="PF" font-weight="900" font-size="36" fill="${ink}">100</text>`;
 g+=`<text x="810" y="372" text-anchor="end" font-family="PF" font-weight="900" font-size="0" fill="${ink}"></text>`;
 return `<svg xmlns="${NS}" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${g}</svg>`;
}
function stamp(){const r=118;let s=`<svg width="300" height="300" viewBox="0 0 300 300"><defs><path id="cp" d="M150 150 m -${r} 0 a ${r} ${r} 0 1 1 ${2*r} 0 a ${r} ${r} 0 1 1 -${2*r} 0"/></defs>`;
 s+=`<g fill="none" stroke="#3A1F16" opacity=".9"><circle cx="150" cy="150" r="140" stroke-width="3"/><circle cx="150" cy="150" r="96" stroke-width="2"/></g>`;
 s+=`<circle cx="150" cy="150" r="140" fill="#F2B544" fill-opacity=".92"/><circle cx="150" cy="150" r="140" fill="none" stroke="#3A1F16" stroke-width="3"/><circle cx="150" cy="150" r="96" fill="none" stroke="#3A1F16" stroke-width="2"/>`;
 s+=`<text font-family="SM" font-weight="700" font-size="18" letter-spacing="5.6" fill="#3A1F16"><textPath href="#cp">STARSFUEL · TELEGRAM STARS · 2026 · </textPath></text>`;
 s+=`<text x="150" y="146" text-anchor="middle" font-family="PF" font-weight="900" font-size="58" fill="#3A1F16">22 000</text>`;
 s+=`<text x="150" y="184" text-anchor="middle" font-family="I" font-weight="900" font-size="22" letter-spacing="8" fill="#3A1F16">SO'M</text></svg>`;return s}
LOGO.then(d=>{
 const N=document.getElementById('notes');
 N.innerHTML=`
 <div class="note" style="left:150px;top:560px;transform:rotate(7deg);box-shadow:0 30px 50px rgba(58,31,22,.28)">${noteSVG('#FBF4EE','#3A1F16','#F2B544',d,'SF 0099 21999')}</div>
 <div class="note" style="left:90px;top:610px;transform:rotate(-5deg);box-shadow:0 34px 60px rgba(58,31,22,.32),0 2px 0 rgba(255,255,255,.4) inset">${noteSVG('#3A1F16','#E9C8B4','#B06750',d,'SF 0100 22000')}</div>
 <div class="stamp" style="left:765px;top:820px;transform:rotate(-14deg);filter:drop-shadow(0 14px 22px rgba(58,31,22,.3))">${stamp()}</div>`;
 document.fonts.ready.then(()=>{window.ready=true});
});
</script></body></html>
