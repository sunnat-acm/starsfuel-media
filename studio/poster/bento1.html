<!doctype html><html><head><meta charset="utf-8">
<script src="../tg_icons/lottie.min.js"></script>
<style>
@font-face{font-family:I;font-weight:600;src:url(../slides/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:700;src:url(../slides/inter-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(inter-latin-900-normal.woff2)}
@font-face{font-family:SM;font-weight:700;src:url(space-mono-latin-700-normal.woff2)}
html,body{margin:0}*{box-sizing:border-box}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:#EEF0F5;font-family:I;color:#0E1116}
.dotbg{position:absolute;inset:0;background-image:radial-gradient(#0E1116 1.2px,transparent 1.4px);background-size:28px 28px;opacity:.08}
.g{position:absolute;left:40px;top:40px;right:40px;bottom:40px;display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(12,1fr);gap:20px}
.t{position:relative;border-radius:44px;overflow:hidden;box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 18px 40px rgba(14,17,22,.10)}
.pat{position:absolute;inset:-20px;display:grid;grid-template-columns:repeat(8,64px);gap:22px;opacity:.16;transform:rotate(-12deg)}
.pat div{width:64px;height:64px}
.lab{position:absolute;font-weight:800;font-size:18px;letter-spacing:3px;opacity:.75}
.big{position:absolute;font-weight:900;letter-spacing:-.045em;line-height:.9}
.ic{position:absolute;filter:drop-shadow(0 22px 30px rgba(0,0,0,.28))}
.chip{position:relative;display:flex;align-items:center;gap:10px;height:54px;padding:0 22px 0 10px;border-radius:27px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);font-weight:800;font-size:22px}
.chip > div{width:38px;height:38px}
.so{font-size:.42em;font-weight:800;letter-spacing:0;opacity:.75;margin-left:6px}
</style></head><body><div class="s">
<div class="dotbg"></div>
<div class="g">
 <!-- HERO -->
 <div class="t" style="grid-column:1/7;grid-row:1/6;background:#fff">
  <div class="lab" style="left:48px;top:44px;display:flex;align-items:center;gap:12px;opacity:1;font-family:I;font-weight:900;font-size:24px;letter-spacing:3px"><img src="../../brand/logo_terracotta.svg" style="width:42px">STARSFUEL</div>
  <div class="lab" style="right:48px;top:50px;opacity:1;color:#2AABEE">● 7 794 OYLIK FOYDALANUVCHI</div>
  <div class="big" style="left:44px;top:130px;font-size:100px">Telegram'ingizni<br><span style="background:linear-gradient(90deg,#2AABEE,#8A5CFF 55%,#FF6FA8);-webkit-background-clip:text;background-clip:text;color:transparent">kuchaytiring.</span></div>
  <div style="position:absolute;left:48px;bottom:44px;display:flex;gap:12px">
   <div class="chip" style="background:#0E1116;color:#fff"><div data-ic="android/002"></div>Stars</div>
   <div class="chip" style="background:#0E1116;color:#fff"><div data-ic="android/514"></div>Premium</div>
   <div class="chip" style="background:#0E1116;color:#fff"><div data-ic="android/009"></div>Gift</div>
   <div class="chip" style="background:#0E1116;color:#fff"><div data-ic="android/441"></div>NFT</div>
  </div>
  <div class="ic" data-ic="ios/093" style="width:210px;height:210px;right:40px;bottom:36px;transform:rotate(12deg)"></div>
  <div class="ic" data-ic="status/031" style="width:90px;height:90px;right:220px;bottom:200px;transform:rotate(-10deg)"></div>
 </div>
 <!-- STARS -->
 <div class="t" style="grid-column:1/4;grid-row:6/10;background:linear-gradient(150deg,#FFC93C,#F28C00);color:#2A1700">
  <div class="pat" data-pat="002,003,007,005,002,004"></div>
  <div class="lab" style="left:36px;top:34px">STARS</div>
  <div class="big" style="left:34px;top:84px;font-size:96px">100 ⭑</div>
  <div class="big" style="left:36px;bottom:40px;font-size:66px">22 000<span class="so">so'm</span></div>
  <div class="ic" data-ic="ios/005" style="width:150px;height:150px;right:24px;top:30px;transform:rotate(10deg)"></div>
 </div>
 <!-- PREMIUM -->
 <div class="t" style="grid-column:4/7;grid-row:6/10;background:linear-gradient(150deg,#B47BFF,#5B2FD6);color:#fff">
  <div class="pat" data-pat="514,515,444,002,514,444"></div>
  <div class="lab" style="left:36px;top:34px">PREMIUM</div>
  <div class="big" style="left:34px;top:84px;font-size:96px">1 oy</div>
  <div class="big" style="left:36px;bottom:40px;font-size:66px">45 000<span class="so">so'm</span></div>
  <div class="ic" data-ic="ios/077" style="width:150px;height:150px;right:24px;top:30px;transform:rotate(-10deg)"></div>
 </div>
 <!-- GIFT/NFT -->
 <div class="t" style="grid-column:1/3;grid-row:10/13;background:linear-gradient(150deg,#4BE3C4,#0F9C82);color:#032B24">
  <div class="pat" data-pat="009,010,320,441,442,321"></div>
  <div class="lab" style="left:30px;top:28px">GIFT · NFT</div>
  <div class="ic" data-ic="ios/070" style="width:118px;height:118px;left:26px;bottom:24px;transform:rotate(-8deg)"></div>
  <div class="ic" data-ic="ios/094" style="width:96px;height:96px;left:150px;bottom:62px;transform:rotate(10deg)"></div>
 </div>
 <!-- NUMBER -->
 <div class="t" style="grid-column:3/5;grid-row:10/13;background:linear-gradient(150deg,#5CC8FF,#1E6FE0);color:#fff">
  <div class="pat" data-pat="243,241,242,244,243,245"></div>
  <div class="lab" style="left:30px;top:28px">RAQAM</div>
  <div class="big" style="left:28px;bottom:30px;font-size:56px">10 000<span class="so">so'm</span></div>
  <div class="ic" data-ic="ios/044" style="width:90px;height:90px;right:22px;top:52px;transform:rotate(10deg)"></div>
 </div>
 <!-- CTA -->
 <div class="t" style="grid-column:5/7;grid-row:10/13;background:#0E1116;color:#fff">
  <div class="lab" style="left:30px;top:28px;opacity:.55">KIRISH</div>
  <div style="position:absolute;left:28px;bottom:30px;display:flex;align-items:center;gap:12px">
   <div style="width:64px;height:64px;border-radius:20px;background:#2AABEE;display:flex;align-items:center;justify-content:center"><div data-ic="android/001" style="width:40px;height:40px"></div></div>
   <div style="font-weight:900;font-size:24px;line-height:1.05">@StarsFuel<br>App <span style="color:#2AABEE">→</span></div>
  </div>
  <div class="ic" data-ic="duck/016" data-pos=".5" style="width:130px;height:130px;right:6px;top:-8px"></div>
 </div>
</div>
</div>
<script>
document.querySelectorAll('[data-pat]').forEach(p=>{const ids=p.dataset.pat.split(',');let h='';for(let i=0;i<64;i++)h+=`<div data-ic="android/${ids[i%ids.length]}"></div>`;p.innerHTML=h;});
const els=[...document.querySelectorAll('[data-ic]')];let left=els.length;window.ready=false;
els.forEach(el=>{const [pk,n]=el.dataset.ic.split('/');const a=lottie.loadAnimation({container:el,renderer:'svg',loop:false,autoplay:false,path:`../tg_icons/${pk}/json/${n}.json`});
 a.addEventListener('DOMLoaded',()=>{a.goToAndStop(Math.floor((a.totalFrames-1)*(+(el.dataset.pos||1))),true);if(--left===0)document.fonts.ready.then(()=>window.ready=true);});});
</script></body></html>
