<!doctype html><html><head><meta charset="utf-8">

@font-face{font-family:'I';font-weight:900;src:url('inter-latin-900-normal.woff2')}
html,body{margin:0;background:#000}*{box-sizing:border-box}

.glass .a{font-weight:900;font-size:54px;letter-spacing:-.03em;line-height:1}
.glass .b{font-weight:800;font-size:24px;opacity:.85;margin-top:8px;letter-spacing:1px}
.pill{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);padding:24px 54px;border-radius:60px;background:#fff;color:#5E8E2E;font-weight:900;font-size:44px;letter-spacing:-.01em;box-shadow:0 20px 50px rgba(0,0,0,.4);white-space:nowrap}
</style>

<div class="s" id="s">
 <div class="rays"></div>
 <div class="top"><img src="logo_white.png">STARSFUEL</div>
 <div class="big">STARS</div>
 <div class="glass" style="left:54px;top:640px;transform:rotate(-5deg)"><div class="a">100 ⭐</div><div class="b">22 000 SO'M</div></div>
 <div class="glass" style="right:54px;top:930px;transform:rotate(5deg)"><div class="a">3 bosish</div><div class="b">TEZ · QULAY</div></div>

 });
});
</script></body></html>
