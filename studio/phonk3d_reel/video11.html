<div id="st"><div id="shk">

 <div class="L" id="words"></div>

</div>

</div>
<script type="module">
import * as THREE from 'three';

const W=1080,H=1920,PI=Math.PI;
// ---------- timing (replaced from the music) ----------

const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));

const cam=new THREE.PerspectiveCamera(30,W/H,0.1,100);
const key=new THREE.DirectionalLight(0xffffff,1.6);key.position.set(-3,4,6);scene.add(key);
const rimG=new THREE.DirectionalLight(0x9BE35A,7);rimG.position.set(5,2,-4);scene.add(rimG);
const rimG2=new THREE.DirectionalLight(0x9BE35A,5);rimG2.position.set(-5,-1,-4);scene.add(rimG2);
const TX={};const names=['stars','stars_filled','premium','xizmat','top','tarix','akkount'];

function makePhone(src){
 const m=src.clone(true);let scr=null;
 m.traverse(o=>{if(o.isMesh&&o.material.name==='pIJKfZsazmcpEiU'){o.material=new THREE.MeshBasicMaterial({toneMapped:false,color:0xffffff});scr=o.material;}});

const ov=document.getElementById('ov'),words=document.getElementById('words');

 <div class="big rgb" id="cd" style="top:60px;font-size:300px"></div>
 <div class="big" id="ask" style="top:1520px;font-size:96px;color:#CFEAA8">TAYYORMISAN?</div>

 <div class="glass" id="c2" style="right:60px;top:1260px"><div class="a">3 oy</div><div class="b">190 000 SO'M</div></div>
 <div class="glass" id="c3" style="left:60px;top:1260px"><div class="a">PUBG UC</div><div class="b">FREE FIRE OLMOS</div></div>
 <div class="big rgb" id="slam" style="top:1440px;font-size:150px"></div>

 <div id="logo" style="top:170px"><img src="logo_white.png">STARSFUEL</div>
 <div class="big" id="cta" style="top:1450px;font-size:70px">Hoziroq kiring</div>
 <div class="pill" id="pill" style="top:1580px"><i class="fab fa-telegram-plane"></i> @StarsFuelBot</div>`;
const $=id=>document.getElementById(id);
const WORD=w=>{const s=(w+'  ').repeat(6);return `<div class="row s">${s}</div><div class="row o">${s}</div><div class="row w">${s}</div><div class="row o">${s}</div>`};

// ---------- seek ----------
const FRONT=PI;
window.seek=function(t){
 const b=(t-T0)/SPB, fb=Math.floor(b), ph=b-fb;
 const P=phones[0],P2=phones[1],P3=phones[2];
 let rx=0.06,ry=FRONT,rz=0,x=0,y=0,z=0,s=1, scr='stars';
 let flash=0, lines=0, shake=0;
 if(b<4){ // intro: back of phone rising out of the dark, countdown
  const k=eo(lin(b,-0.7,4));ry=-0.5+b*0.12;rx=0.25-k*0.15;y=mix(-2.6,-0.22,k);z=-0.4;rz=0.05;
 } else if(b<12){
  const k=eo(lin(b,4,5));ry=mix(-0.02,FRONT-0.38+2*PI,k)-(b>=5?0:0);if(b>=5)ry=FRONT-0.38+2*PI+0.06*Math.sin((b-5)*0.8);

 } else if(b<16){
  const k=eo(lin(b,12,13));ry=mix(FRONT-0.38,FRONT+0.38+2*PI,k);x=mix(0.36,-0.36,k);s=1+0.1*Math.sin(k*PI);rx=0.1;

 } else if(b<20){
  const k=eo(lin(b,16,17));ry=mix(FRONT+0.38,FRONT-0.38+2*PI,k);x=mix(-0.36,0.36,k);s=1+0.1*Math.sin(k*PI);rx=0.1;
  if(b>=17)ry=FRONT-0.38+0.06*Math.sin((b-17)*0.8);
  scr=b<16.5?'premium':'xizmat';lines=Math.sin(lin(b,16,17)*PI);
 } else if(b<24){ // beat cuts
  const i=fb-20;scr=['top','tarix','premium','stars_filled'][cl(i,0,3)];
  const k=eo(cl(ph*3));x=mix(0.36,0,eo(lin(b,20,20.5)));ry=FRONT+(i%2?0.22:-0.22)*(1-0.4*k);rz=(i%2?-0.06:0.06)*(1-k);s=1.12-0.12*k;rx=0.08;y=0.15;
 } else if(b<28){ // trio
  const k=eo(lin(b,24,25.2));scr='stars_filled';ry=FRONT+0.04*Math.sin(b);s=mix(1,0.8,k);y=mix(0.15,0.05,k);z=0;
 } else { // end
  const k=eo(lin(b,28,29));scr='stars';ry=FRONT+0.18*Math.sin((b-28)*0.5)*(1-0.3*k);s=mix(0.78,0.86,k);y=mix(0.05,0.02,k)+0.03*Math.sin(b*0.6);rx=0.05;
 }
 // beat bump & shake after drop
 if(b>=4){const d=Math.exp(-ph*6);s*=1+0.025*d;shake=(b<24?10:6)*d;}

 const tk=b<24?0:(b<28?eo(lin(b,24,25.2)):1-eio(lin(b,28,29)));
 [[P2,-1,'premium'],[P3,1,'xizmat']].forEach(([Q,sg,n])=>{Q.set(n);Q.g.visible=tk>0.001;
  Q.g.position.set(sg*mix(3.2,0.95,tk),0.0+0.03*Math.sin(b+sg),-0.6);Q.g.rotation.set(0.06,FRONT-sg*mix(1.2,0.42,tk),sg*0.04);Q.g.scale.setScalar(Q.g.userData.k*0.68)});

 $('floor').style.backgroundPosition=`0 ${(t*420)%120}px`;

 // words marquee
 let w=null;if(b>=4&&b<12)w='STARS';else if(b>=12&&b<16)w='PREMIUM';else if(b>=16&&b<20)w="O'YINLAR";
 setWord(w);
 if(w){const rows=words.children;for(let i=0;i<rows.length;i++){rows[i].style.top=(i*250)+'px';const dir=i%2?1:-1;rows[i].style.transform=`translateX(${-600+dir*((t*260)%1200)-300}px)`;rows[i].style.opacity=i===2?0.95:0.55}
  const wk=b<12?lin(b,4,4.6):lin(b,Math.floor(b/4)*4,Math.floor(b/4)*4+0.6);words.style.opacity=wk;words.style.transform=`scale(${1.3-0.3*eo(wk)})`}

 const cd=$('cd');
 if(b<4&&b>=0){const n=Math.floor(b);cd.textContent=n===0?'':String(4-n);const k=ph;cd.style.opacity=n===0?0:1-lin(k,0.7,1);cd.style.transform=`scale(${1.6-0.6*eo(cl(k*3))})`;}

 callout('c1',8.2,12,-300);callout('c2',13.1,16,300);callout('c3',17.1,20,-300);
 // slam words
 const sl=$('slam');if(b>=20&&b<24){const i=fb-20;sl.textContent=['TEZ.','QULAY.','ISHONCHLI.','BITTA BOTDA.'][i];sl.style.opacity=1;sl.style.transform=`scale(${1.35-0.35*eo(cl(ph*4))})`;sl.style.fontSize=i===3?'120px':'150px'}else sl.style.opacity=0;

 const ck=lin(b,29,29.8);$('cta').style.opacity=ck;$('cta').style.transform=`translateY(${40*(1-eo(ck))}px)`;

};
Promise.all(names.map(loadT)).then(()=>gltf.load('phone.glb',g=>{for(let i=0;i<3;i++)phones.push(makePhone(g.scene));document.fonts.ready.then(()=>{seek(0);window.READY=1})}));
