<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fa/css/all.min.css">
<style>
@font-face{font-family:'I';font-weight:800;src:url('inter-latin-800-normal.woff2')}
@font-face{font-family:'I';font-weight:900;src:url('inter-latin-900-normal.woff2')}
html,body{margin:0;background:#000;overflow:hidden}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:'I';color:#fff}
canvas{position:absolute;left:0;top:0}
#ui{position:absolute;inset:0;pointer-events:none}
.lbl{position:absolute;text-align:center;text-shadow:0 2px 6px rgba(0,0,0,.45),0 0 30px rgba(0,0,0,.45)}
</style></head><body>
<div id="st"><canvas id="gl" width="1080" height="1920"></canvas><div id="ui"></div></div>
<script>
/* ================= LIQUID GLASS SHADER =================
   Background = any 2D canvas (redrawn each frame) -> texture.
   Glass shapes = rounded boxes, merged with smooth-min (liquid blobs).
   Per pixel inside glass:
     1. SDF distance d (<0 inside) + normal from SDF gradient
     2. edge factor e: 0 in the middle, 1 at the rim (bezel width uBezel)
     3. refraction: UV shifted along -normal by e^2.5*uRefract (lens bend at rim) + slight magnify
     4. chromatic dispersion: R,G,B sampled with different refraction strength
     5. frost: 16-tap disc blur (radius uFrost)
     6. tint + specular rim (light from top-left) + inner glow line
   Outside: soft drop shadow.
*/
const W=1080,H=1920;
const cv=document.getElementById('gl');const gl=cv.getContext('webgl2',{preserveDrawingBuffer:true,premultipliedAlpha:false});
const VS=`#version 300 es
in vec2 p;out vec2 uv;void main(){uv=p*.5+.5;gl_Position=vec4(p,0,1);}`;
const FS=`#version 300 es
precision highp float;
in vec2 uv;out vec4 o;
uniform sampler2D uBg;uniform vec2 uRes;
uniform vec4 uBox[8];uniform float uRad[8];uniform int uN;uniform float uK;
uniform float uRefract,uBezel,uFrost,uDisp,uTint,uSpec;uniform vec3 uTintCol;
float sdBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-b+r;return length(max(q,0.))+min(max(q.x,q.y),0.)-r;}
float smin(float a,float b,float k){float h=clamp(.5+.5*(b-a)/k,0.,1.);return mix(b,a,h)-k*h*(1.-h);}
float sdf(vec2 p){float d=1e5;for(int i=0;i<8;i++){if(i>=uN)break;float di=sdBox(p-uBox[i].xy,uBox[i].zw,uRad[i]);d=(i==0)?di:smin(d,di,uK);}return d;}
vec3 bg(vec2 px){return texture(uBg,vec2(px.x/uRes.x,px.y/uRes.y)).rgb;}
vec3 frost(vec2 px,float r){vec3 c=vec3(0);float w=0.;
 for(int i=0;i<16;i++){float a=float(i)*2.39996;float rr=r*sqrt((float(i)+.5)/16.);vec2 o=vec2(cos(a),sin(a))*rr;c+=bg(px+o);w+=1.;}return c/w;}
void main(){
 vec2 px=vec2(uv.x*uRes.x,(1.-uv.y)*uRes.y);
 float d=sdf(px);
 vec3 base=bg(px);
 if(d>0.){ // drop shadow
   float sh=sdf(px-vec2(0.,18.));float s=1.-smoothstep(-10.,60.,sh);
   o=vec4(base*(1.-.35*s),1.);return;}
 vec2 e2=vec2(1.5,0);
 vec2 n=normalize(vec2(sdf(px+e2.xy)-sdf(px-e2.xy),sdf(px+e2.yx)-sdf(px-e2.yx))+1e-6);
 float e=clamp(1.+d/uBezel,0.,1.);           // 1 at rim -> 0 inside
 float bend=pow(e,2.5);
 vec2 off=-n*bend*uRefract;
 // dispersion: each channel bends differently
 vec3 col;
 float fr=uFrost*(.6+.4*(1.-e));
 col.r=frost(px+off*(1.+uDisp),fr).r;
 col.g=frost(px+off,fr).g;
 col.b=frost(px+off*(1.-uDisp),fr).b;
 // tint + lift
 col=mix(col,uTintCol,uTint)*1.06+.03;
 // specular rim from top-left light
 vec2 L=normalize(vec2(-.6,-.8));
 float rim=pow(e,6.)*(.35+.65*max(dot(n,L),0.));
 float rim2=pow(e,6.)*max(dot(n,-L),0.)*.45;
 col+=uSpec*(rim+rim2);
 // thin bright edge line
 col+=smoothstep(-2.5,0.,d)*.35*uSpec;
 // anti-aliased composite at boundary
 float a=smoothstep(.5,-1.,d);
 o=vec4(mix(base,col,a),1.);
}`;
function sh(t,s){const x=gl.createShader(t);gl.shaderSource(x,s);gl.compileShader(x);if(!gl.getShaderParameter(x,gl.COMPILE_STATUS))throw gl.getShaderInfoLog(x);return x}
const pr=gl.createProgram();gl.attachShader(pr,sh(gl.VERTEX_SHADER,VS));gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,FS));gl.linkProgram(pr);gl.useProgram(pr);
const vb=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,vb);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
const U=n=>gl.getUniformLocation(pr,n);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
// public API: renderGlass(bgCanvas, shapes, opts)
window.renderGlass=function(bgc,shapes,o={}){
 gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,bgc);
 const B=new Float32Array(32),R=new Float32Array(8);shapes.slice(0,8).forEach((s,i)=>{B.set([s.x,s.y,s.w/2,s.h/2],i*4);R[i]=Math.min(s.r,s.w/2,s.h/2)});
 gl.uniform4fv(U('uBox'),B);gl.uniform1fv(U('uRad'),R);gl.uniform1i(U('uN'),shapes.length);gl.uniform2f(U('uRes'),W,H);
 gl.uniform1f(U('uK'),o.k??60);gl.uniform1f(U('uRefract'),o.refract??70);gl.uniform1f(U('uBezel'),o.bezel??60);
 gl.uniform1f(U('uFrost'),o.frost??10);gl.uniform1f(U('uDisp'),o.disp??.18);gl.uniform1f(U('uTint'),o.tint??.08);gl.uniform1f(U('uSpec'),o.spec??.55);
 gl.uniform3fv(U('uTintCol'),o.tintCol??[1,1,1]);
 gl.viewport(0,0,W,H);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
};
/* ================= DEMO SCENE ================= */
const bgc=document.createElement('canvas');bgc.width=W;bgc.height=H;const c=bgc.getContext('2d');
const logo=new Image();logo.src='logo_white.png';const app=new Image();app.src='tex_stars_filled.jpg';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),lin=(x,a,b)=>cl((x-a)/(b-a)),eo=x=>1-Math.pow(1-x,3),eio=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,mix=(a,b,k)=>a+(b-a)*k;
function drawBg(t){
 const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,'#0d1f08');g.addColorStop(.5,'#2f5a1a');g.addColorStop(1,'#08140a');c.fillStyle=g;c.fillRect(0,0,W,H);
 // colourful blobs
 [[300,500,'#A6D06A'],[820,900,'#F2B544'],[260,1400,'#5ad1ff'],[800,1650,'#A6D06A']].forEach((b,i)=>{const x=b[0]+80*Math.sin(t*.7+i),y=b[1]+60*Math.cos(t*.5+i*2);
  const rg=c.createRadialGradient(x,y,0,x,y,360);rg.addColorStop(0,b[2]);rg.addColorStop(1,'rgba(0,0,0,0)');c.globalAlpha=.75;c.fillStyle=rg;c.fillRect(0,0,W,H);c.globalAlpha=1});
 // diagonal stripes
 c.save();c.globalAlpha=.10;c.strokeStyle='#fff';c.lineWidth=14;for(let i=-30;i<30;i++){c.beginPath();const x=i*90+((t*60)%90);c.moveTo(x,0);c.lineTo(x+H*.5,H);c.stroke()}c.restore();
 // big marquee words
 c.font="900 230px I";c.textBaseline='top';
 const rows=[['STARSFUEL  ','#A6D06A',200],['STARS  PREMIUM  ','#ffffff',470],['GIFT  NFT  UC  ','#F2B544',820],['22 000  ','#A6D06A',1060],['STARSFUEL  ','#ffffff',1350]];
 rows.forEach((r,i)=>{const s=r[0].repeat(4);const wdt=c.measureText(r[0]).width;const x=-((t*(i%2?-140:140))%wdt+wdt)%wdt;c.fillStyle=r[1];c.globalAlpha=i%2?.9:.95;c.fillText(s,x-wdt,r[2]);c.globalAlpha=1});
 // phone screenshot strip + logo
 if(logo.complete){c.drawImage(logo,W/2-110,1610+10*Math.sin(t*2),220,220)}
}
const ui=document.getElementById('ui');
ui.innerHTML=`<div class="lbl" id="l1" style="font-weight:900;font-size:120px;width:860px;left:110px">100 ⭐</div>
<div class="lbl" id="l2" style="font-weight:800;font-size:46px;width:860px;left:110px;opacity:.9">22 000 so'm</div>
<div class="lbl" id="l3" style="font-weight:900;font-size:56px;width:700px;left:190px"><i class="fab fa-telegram-plane"></i> @StarsFuelBot</div>`;
window.seek=function(t){
 drawBg(t);
 // two liquid drops merge, then split
 const m=0.5-0.5*Math.cos(t*1.6);
 const dx=mix(260,40,m);
 const card={x:540,y:mix(1000,900,eio(lin(t,0,1.2))),w:860,h:mix(300,420,eo(lin(t,0,1.2))),r:80};
 const pill={x:540,y:1500,w:mix(560,720,.5+.5*Math.sin(t*2)),h:150,r:75};
 const d1={x:540-dx,y:420,w:260,h:260,r:130},d2={x:540+dx,y:420+40*Math.sin(t*1.6),w:220,h:220,r:110};
 renderGlass(bgc,[d1,d2,card,pill],{k:70,refract:80,bezel:70,frost:14,disp:.22,tint:.10,tintCol:[.85,.95,.8],spec:.6});
 const l1=document.getElementById('l1'),l2=document.getElementById('l2'),l3=document.getElementById('l3');
 l1.style.top=(card.y-110)+'px';l2.style.top=(card.y+40)+'px';l3.style.top=(pill.y-34)+'px';
};
document.fonts.load("900 230px I").then(()=>Promise.all([logo.decode(),app.decode()])).then(()=>{seek(0);window.READY=1});
</script></body></html>
