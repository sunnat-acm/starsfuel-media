const els=[...document.querySelectorAll('[data-ic]')];let left=els.length;window.ready=false;
els.forEach(el=>{const [pk,n]=el.dataset.ic.split('/');const a=lottie.loadAnimation({container:el,renderer:'svg',loop:false,autoplay:false,path:`../tg_icons/${pk}/json/${n}.json`});
