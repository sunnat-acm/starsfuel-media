<!doctype html><html><head><meta charset="utf-8"><script src="paths.js"></script>
<link rel="stylesheet" href="fa/css/all.min.css">
<style>
@font-face{font-family:'I';font-weight:500;src:url('inter-latin-500-normal.woff2')}
@font-face{font-family:'I';font-weight:600;src:url('inter-latin-600-normal.woff2')}
@font-face{font-family:'I';font-weight:700;src:url('inter-latin-700-normal.woff2')}
@font-face{font-family:'I';font-weight:800;src:url('inter-latin-800-normal.woff2')}
@font-face{font-family:'I';font-weight:900;src:url('inter-latin-900-normal.woff2')}
html,body{margin:0;background:#000}*{box-sizing:border-box}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'I';color:#fff;background:#0a0605}
.glow{position:absolute;border-radius:50%;filter:blur(110px)}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:.5px}
.h{position:absolute;left:72px;font-weight:900;letter-spacing:-.045em;line-height:.98}
.p{position:absolute;left:72px;font-weight:500;font-size:34px;line-height:1.35;color:rgba(255,255,255,.78)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(22px) saturate(160%);-webkit-backdrop-filter:blur(22px) saturate(160%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.swipe{position:absolute;right:64px;bottom:64px;height:92px;border-radius:46px;display:flex;align-items:center;gap:18px;padding:0 18px 0 30px;font-size:30px;font-weight:700}
.swipe .n{font-weight:900;font-size:34px}
.swipe .n span{opacity:.5;font-weight:700}
.swipe .ar{width:60px;height:60px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:24px}
.dots{position:absolute;left:72px;bottom:100px;display:flex;gap:12px}
.dots i{display:block;width:14px;height:14px;border-radius:7px;background:rgba(255,255,255,.3)}
.dots i.on{width:44px;background:#fff}
.phone{position:absolute;border-radius:64px;padding:14px;background:linear-gradient(145deg,#3d4047,#0b0b0d 45%,#2a2c31);box-shadow:0 50px 100px rgba(0,0,0,.6)}
.phone .in{width:100%;height:100%;border-radius:50px;overflow:hidden;position:relative}
.phone img{position:absolute;left:0;top:0;width:100%}
.chip{position:absolute;border-radius:28px;padding:22px 30px;display:flex;align-items:center;gap:18px;font-weight:800;font-size:32px}
.ic{width:62px;height:62px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:28px;color:#fff;flex:none}
.gold{background:linear-gradient(180deg,#FFE29A,#F2B544 55%,#D9892B);-webkit-background-clip:text;background-clip:text;color:transparent}
.terra{color:#F08A67}
</style></head><body>
<div id="root"></div>
<script>
const BADGE=(sz)=>`<svg width="${sz}" height="${sz}" viewBox="4.4 4.1 2288 2285"><path d="${BADGE_D}" fill="#B06750" fill-rule="evenodd"/><path d="${STAR_D}" fill="#FBF4EE"/></svg>`;
const brand=`<div class="brand">${BADGE(54)}<span>STARSFUEL</span></div>`;
const swipe=(n,last)=>`<div class="swipe glass"><div class="n">${n}<span>/4</span></div><div>${last?"Botga kiring":"Suring"}</div><div class="ar"><i class="fas ${last?'fa-paper-plane':'fa-arrow-right'}"></i></div></div>`;

const phone=(src,x,y,w,rot,crop=0)=>`<div class="phone" style="left:${x}px;top:${y}px;width:${w}px;height:${w*2+28}px;transform:rotate(${rot}deg)"><div class="in"><img src="img/${src}.jpg" style="top:${-crop}px"></div></div>`;
const S={
1:`${bg('#B06750','#F2B544','#E8452C')}${brand}
 <div class="h" style="top:190px;font-size:124px">Telegram<br><span class="gold">Stars</span><br>3 bosishda.</div>

 ${phone('stars_filled',650,560,340,7)}
 <div class="chip glass" style="left:72px;top:880px"><div class="ic" style="background:#E0A23A"><i class="fas fa-star"></i></div><div>100 Stars<br><span style="font-weight:600;font-size:26px;opacity:.75">22 000 so'm</span></div></div>
 ${dots(1)}${swipe(1)}`,
2:`${bg('#7A3A27','#B06750','#F2B544')}${brand}
 <div class="h" style="top:180px;font-size:40px;color:#F2B544;font-weight:800;letter-spacing:2px">QADAM 1</div>
 <div class="h" style="top:240px;font-size:104px">Miqdor va<br>username.</div>
 ${phone('stars_filled',190,520,470,0,130)}
 <div class="chip glass" style="left:470px;top:600px;transform:rotate(-4deg)"><div class="ic" style="background:#B06750"><i class="fas fa-hashtag"></i></div>100 Stars</div>
 <div class="chip glass" style="left:540px;top:800px;transform:rotate(3deg)"><div class="ic" style="background:#2AA3D8"><i class="fas fa-at"></i></div>username</div>
 ${dots(2)}${swipe(2)}`,
3:`${bg('#1d4a2a','#B6F23A','#2BB463')}${brand}
 <div class="h" style="top:180px;font-size:40px;color:#B6F23A;font-weight:800;letter-spacing:2px">QADAM 2</div>
 <div class="h" style="top:240px;font-size:104px">Aynan o'sha<br>summani to'lang.</div>
 <div class="glass" style="position:absolute;left:72px;top:520px;width:936px;height:200px;border-radius:40px;padding:34px 44px;border-color:rgba(182,242,58,.6)"><div style="font-size:28px;font-weight:600;opacity:.75">Sahifada ko'rsatilgan</div><div style="font-size:92px;font-weight:900;letter-spacing:-3px;color:#B6F23A">11 001 so'm <i class="fas fa-circle-check" style="font-size:64px;color:#2BB463"></i></div></div>
 <div class="glass" style="position:absolute;left:72px;top:750px;width:450px;height:150px;border-radius:32px;padding:26px 34px;border-color:rgba(229,72,77,.6)"><div style="font-size:24px;font-weight:600;opacity:.7">Yaxlitlangan</div><div style="font-size:58px;font-weight:900;color:#ff8a8d">11 800 <i class="fas fa-circle-xmark"></i></div></div>
 <div class="glass" style="position:absolute;left:558px;top:750px;width:450px;height:150px;border-radius:32px;padding:26px 34px;border-color:rgba(229,72,77,.6)"><div style="font-size:24px;font-weight:600;opacity:.7">Boshqa summa</div><div style="font-size:58px;font-weight:900;color:#ff8a8d">12 000 <i class="fas fa-circle-xmark"></i></div></div>
 <div class="p" style="top:940px;width:900px">1 so'm farq bo'lsa ham, to'lov avtomatik aniqlanmaydi. Karta yoki balans orqali to'lash mumkin.</div>
 ${dots(3)}${swipe(3)}`,
4:`${bg('#B06750','#F2B544','#8E5BD8')}${brand}
 <div class="h" style="top:180px;font-size:112px">Faqat Stars<br><span class="gold">emas.</span></div>
 ${[['fa-star','Stars','#E0A23A'],['fa-crown','Premium','#8E5BD8'],['fa-gift','Gift','#D8585B'],['fa-image','NFT','#3E8ED8'],['fa-crosshairs','PUBG UC','#C7902E'],['fa-fire','Free Fire','#E0622E']].map((c,i)=>`<div class="chip glass" style="left:${72+(i%2)*478}px;top:${470+Math.floor(i/2)*150}px;width:458px"><div class="ic" style="background:${c[2]}"><i class="fas ${c[0]}"></i></div>${c[1]}</div>`).join('')}
 <div class="chip glass" style="left:72px;top:920px;width:936px;justify-content:center"><div class="ic" style="background:#2AA3D8"><i class="fas fa-mobile-screen-button"></i></div>Telegram akkaunt</div>
 <div style="position:absolute;left:72px;top:1090px;height:96px;border-radius:48px;background:#B06750;padding:0 40px;display:flex;align-items:center;gap:18px;font-weight:900;font-size:40px;box-shadow:0 20px 50px rgba(176,103,80,.5)"><i class="fas fa-magnifying-glass"></i>@StarsFuelBot</div>
 ${swipe(4,true)}`
};
const n=+new URLSearchParams(location.search).get('s')||1;
document.getElementById('root').innerHTML=`<div class="s">${S[n]}</div>`;
</script></body></html>
