<!doctype html><html><head><meta charset="utf-8"><script src="paths.js"></script>
<link rel="stylesheet" href="fa/css/all.min.css">
<style>
@font-face{font-family:'I';font-weight:500;src:url('inter-latin-500-normal.woff2')}
@font-face{font-family:'I';font-weight:600;src:url('inter-latin-600-normal.woff2')}
@font-face{font-family:'I';font-weight:700;src:url('inter-latin-700-normal.woff2')}
@font-face{font-family:'I';font-weight:800;src:url('inter-latin-800-normal.woff2')}
@font-face{font-family:'I';font-weight:900;src:url('inter-latin-900-normal.woff2')}
html,body{margin:0;background:#000}*{box-sizing:border-box}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:'I';color:#fff;background:#0b0614}
.glow{position:absolute;border-radius:50%;filter:blur(120px)}
.grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
.brand{position:absolute;left:72px;top:64px;display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:.5px}
.h{position:absolute;left:72px;font-weight:900;letter-spacing:-.045em;line-height:.98}
.p{position:absolute;left:72px;font-weight:500;font-size:34px;line-height:1.35;color:rgba(255,255,255,.78)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,.05));border:1.5px solid rgba(255,255,255,.28);backdrop-filter:blur(22px) saturate(160%);box-shadow:0 20px 50px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.swipe{position:absolute;right:64px;bottom:64px;height:92px;border-radius:46px;display:flex;align-items:center;gap:18px;padding:0 18px 0 30px;font-size:30px;font-weight:700}
.swipe .n{font-weight:900;font-size:34px}.swipe .n span{opacity:.5;font-weight:700}
.swipe .ar{width:60px;height:60px;border-radius:50%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;font-size:24px}
.dots{position:absolute;left:72px;bottom:100px;display:flex;gap:12px}
.dots i{display:block;width:14px;height:14px;border-radius:7px;background:rgba(255,255,255,.3)}.dots i.on{width:44px;background:#fff}
.card{position:absolute;left:72px;width:936px;border-radius:44px;padding:44px 48px}
.card .ic{width:110px;height:110px;border-radius:32px;display:flex;align-items:center;justify-content:center;font-size:52px;color:#fff;margin-bottom:28px}
.card h3{margin:0;font-size:64px;font-weight:900;letter-spacing:-.03em;line-height:1}
.card p{margin:14px 0 0;font-size:32px;font-weight:500;color:rgba(255,255,255,.75);line-height:1.35}
.num{position:absolute;right:48px;top:30px;font-size:120px;font-weight:900;color:rgba(255,255,255,.12);letter-spacing:-.05em}
.grad{background:linear-gradient(90deg,#B98BFF,#FF7EB6 55%,#FFB86B);-webkit-background-clip:text;background-clip:text;color:transparent}
.price{position:absolute;left:72px;width:936px;height:130px;border-radius:34px;display:flex;align-items:center;justify-content:space-between;padding:0 44px;font-size:44px;font-weight:800}
.price b{font-size:52px;font-weight:900}
</style></head><body>
<div id="root"></div>
<script>
const BADGE=(sz)=>`<svg width="${sz}" height="${sz}" viewBox="4.4 4.1 2288 2285"><path d="${BADGE_D}" fill="#B06750" fill-rule="evenodd"/><path d="${STAR_D}" fill="#FBF4EE"/></svg>`;
const brand=`<div class="brand">${BADGE(54)}<span>STARSFUEL</span></div>`;
const swipe=(n,last)=>`<div class="swipe glass"><div class="n">${n}<span>/5</span></div><div>${last?"Botga kiring":"Suring"}</div><div class="ar"><i class="fas ${last?'fa-paper-plane':'fa-arrow-right'}"></i></div></div>`;
const dots=n=>`<div class="dots">${[1,2,3,4,5].map(i=>`<i class="${i===n?'on':''}"></i>`).join('')}</div>`;
const bg=`<div class="glow" style="width:950px;height:950px;left:-300px;top:-320px;background:#7B3FE4;opacity:.6"></div><div class="glow" style="width:850px;height:850px;right:-320px;bottom:-280px;background:#FF5E9C;opacity:.45"></div><div class="glow" style="width:520px;height:520px;right:80px;top:280px;background:#FFB86B;opacity:.22"></div><div class="grain"></div>`;
const card=(top,n,icon,col,title,text)=>`<div class="card glass" style="top:${top}px"><div class="num">0${n}</div><div class="ic" style="background:${col}"><i class="fas ${icon}"></i></div><h3>${title}</h3><p>${text}</p></div>`;
const S={
1:`${bg}${brand}
 <div style="position:absolute;left:72px;top:200px;width:150px;height:150px;border-radius:44px;background:linear-gradient(135deg,#8E5BD8,#FF5E9C);display:flex;align-items:center;justify-content:center;font-size:76px;box-shadow:0 30px 70px rgba(142,91,216,.55)"><i class="fas fa-crown"></i></div>
 <div class="h" style="top:410px;font-size:132px">Telegram<br><span class="grad">Premium</span><br>nima beradi?</div>
 <div class="p" style="top:850px;width:900px">Ko'pchilik bilmaydigan <b style="color:#fff">8 ta imkoniyat</b> — suring va o'zingiz baholang.</div>
 ${dots(1)}${swipe(1)}`,
2:`${bg}${brand}
 <div class="h" style="top:170px;font-size:44px;font-weight:800;letter-spacing:2px;color:#C9A8FF">TEZLIK VA HAJM</div>
 ${card(260,1,'fa-file-arrow-up','#8E5BD8','4 GB gacha fayl','Oddiy akkauntda limit 2 GB. Premium bilan kino, arxiv, loyihalarni bemalol yuborasiz.')}
 ${card(700,2,'fa-gauge-high','#FF5E9C','Tezroq yuklab olish','Fayl va videolar tezlik cheklovisiz yuklanadi.')}
 ${dots(2)}${swipe(2)}`,
3:`${bg}${brand}
 <div class="h" style="top:170px;font-size:44px;font-weight:800;letter-spacing:2px;color:#C9A8FF">QULAYLIK</div>
 ${card(260,3,'fa-microphone-lines','#3E8ED8','Ovozdan matnga',"Ovozli xabarni eshitmasdan o'qiysiz — majlisda ham, shovqinda ham.")}
 ${card(700,4,'fa-ban','#E0622E','Reklamasiz','Ommaviy kanallardagi homiy reklamalari ko\'rinmaydi.')}
 ${dots(3)}${swipe(3)}`,
4:`${bg}${brand}
 <div class="h" style="top:170px;font-size:44px;font-weight:800;letter-spacing:2px;color:#C9A8FF">IKKI BAROBAR KO'P</div>
 <div class="card glass" style="top:250px;height:630px"><div class="num">05</div><div class="ic" style="background:#2BB463"><i class="fas fa-layer-group"></i></div><h3>Limitlar x2</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:34px">
   ${[['1000','ta kanal'],['20','ta papka'],['10','ta pin chat'],['4 ta','akkaunt']].map(x=>`<div style="border-radius:26px;background:rgba(255,255,255,.08);padding:22px 28px"><div style="font-size:60px;font-weight:900">${x[0]}</div><div style="font-size:28px;opacity:.75;font-weight:600">${x[1]}</div></div>`).join('')}</div></div>
 <div style="position:absolute;left:72px;top:910px;width:936px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px">
  ${[['fa-face-grin-stars','Premium stikerlar','#FFB86B'],['fa-circle-user','Animatsiyali avatar','#B98BFF'],['fa-star','Emoji status','#FF5E9C']].map((c,i)=>`<div class="glass" style="border-radius:32px;padding:28px 26px;height:205px"><div style="width:74px;height:74px;border-radius:22px;background:${c[2]};display:flex;align-items:center;justify-content:center;font-size:34px"><i class="fas ${c[0]}"></i></div><div style="margin-top:22px;font-size:32px;font-weight:800;line-height:1.1">${c[1]}</div><div class="num" style="font-size:60px;right:22px;top:18px">0${6+i}</div></div>`).join('')}</div>
 ${dots(4)}${swipe(4)}`,
5:`${bg}${brand}
 <div class="h" style="top:180px;font-size:112px">Premium<br><span class="grad">StarsFuel'da.</span></div>
 ${[["3 oy","190 000 so'm"],["6 oy","250 000 so'm"],["12 oy","400 000 so'm"]].map((x,i)=>`<div class="price glass" style="top:${470+i*160}px${i==2?';border-color:#FFB86B;box-shadow:0 0 0 6px rgba(255,184,107,.25)':''}"><span>${x[0]}${i==2?' <span style="font-size:26px;padding:8px 16px;border-radius:20px;background:#FFB86B;color:#2a1405;margin-left:12px;vertical-align:middle">eng foydali</span>':''}</span><b>${x[1]}</b></div>`).join('')}
 <div class="p" style="top:960px;width:900px;font-size:30px">O'zingizga yoki do'stingizga — username yozasiz, xolos.</div>
 <div style="position:absolute;left:72px;top:1090px;height:96px;border-radius:48px;background:#B06750;padding:0 40px;display:flex;align-items:center;gap:18px;font-weight:900;font-size:40px;box-shadow:0 20px 50px rgba(176,103,80,.5)"><i class="fas fa-magnifying-glass"></i>@StarsFuelBot</div>
 ${swipe(5,true)}`
};
const n=+new URLSearchParams(location.search).get('s')||1;
document.getElementById('root').innerHTML=`<div class="s">${S[n]}</div>`;
</script></body></html>
