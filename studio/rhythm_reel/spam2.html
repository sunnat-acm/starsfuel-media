<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:I;font-weight:500;src:url(../slides/inter-latin-500-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(../slides/inter-latin-600-normal.woff2)}
@font-face{font-family:I;font-weight:700;src:url(../slides/inter-latin-700-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(../slides/inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:900;src:url(../slides/inter-latin-900-normal.woff2)}
html,body{margin:0;background:#000}*{box-sizing:border-box}
#v{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:I;color:#fff;background:#000}
.L{position:absolute;inset:0;overflow:hidden}.a{position:absolute}
.c{position:absolute;left:0;right:0;text-align:center;white-space:nowrap;font-weight:900;line-height:1}
.pill{border-radius:999px;display:inline-flex;align-items:center;gap:14px}
.grain{position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
</style></head><body><div id="v"><div id="st" class="L"></div>
<div id="br" class="a" style="left:60px;top:186px;display:flex;align-items:center;gap:14px;font:800 30px I;letter-spacing:2px"><img src="../../brand/logo.svg" style="width:50px">STARSFUEL</div>
<div class="grain"></div></div>
<script>
const BT=.6,DN=24,SH='../slides/shots/';
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>x>=1?1:1-Math.pow(2,-10*x),e3=x=>1-Math.pow(1-x,3),io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2,L=(a,b,x)=>a+(b-a)*x;
const sp=x=>x>=1?1:1-Math.exp(-7*x)*Math.cos(9*x);            // light spring
const fmt=n=>Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g,' ');
const IMG=n=>`icons/${n}.png`,FLG=c=>`flags/${c}.png`;
const slam=(k)=>`opacity:${k>0?1:0};transform:scale(${L(2.1,1,k)});filter:blur(${L(16,0,k)}px);`;
const rise=(k,d=40)=>`opacity:${cl(k*2)};transform:translateY(${L(d,0,k)}px);`;
const FLAGS=[['1f1fa-1f1f8','AQSh'],['1f1e7-1f1e9','Bangladesh'],['1f1e8-1f1f4','Kolumbiya'],['1f1f3-1f1ec','Nigeriya'],['1f1ea-1f1f9','Efiopiya'],['1f1ee-1f1e9','Indoneziya']];
function phone(img,u,dur,r0,r1,word,g){const k=eo(P(u,0,.6)),m=io(P(u,.2,dur-.1));
 return `<div class="L" style="background:${g}"></div>
 <div class="c" style="top:250px;font-size:230px;letter-spacing:-10px;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.4);transform:translateX(${L(120,-120,m)}px)">${word}</div>
 <div class="a" style="left:0;right:0;top:330px;height:1340px;perspective:2200px"><img src="${SH}${img}" style="position:absolute;left:226px;top:0;height:1340px;transform:translateY(${L(260,0,k)}px) rotateY(${L(r0,r1,m)}deg) rotateX(${L(14,4,k)}deg) scale(${L(.86,1,k)});filter:drop-shadow(0 60px 80px rgba(0,0,0,.55))"></div>
 <div class="a pill" style="right:60px;top:186px;background:#34c759;font:800 26px I;padding:10px 22px;${rise(eo(P(u,.4,.7)),20)}">Real ilova</div>`}
const S=[
// 0 intro
[4,u=>{const s1=eo(P(u,.1,.4)),s2=eo(P(u,1.2,1.5)),d=sp(P(u,.1,.9));const k=P(u,1.2,1.8),a=(1-k)*26;const x=k>0&&k<1?a*Math.sin(u*95):0,y=k>0&&k<1?a*Math.cos(u*73):0;
 const fl=u>=1.2&&u<1.32?1-(u-1.2)/.12:0;const bd=eo(P(u,1.75,2.1));
 return `<div class="L" style="background:radial-gradient(90% 60% at 50% 45%,#FF3B30,#8E0E12 60%,#3a0507)"></div>
 <div class="L" style="transform:translate(${x}px,${y}px)">
  <img class="a" src="${IMG('ios_052')}" style="left:390px;top:${L(-340,300,d)}px;width:300px;transform:rotate(${L(-40,-8,d)}deg);filter:drop-shadow(0 30px 40px rgba(0,0,0,.4))">
  <div class="c" style="top:660px;font-size:370px;letter-spacing:-19px;${slam(s1)}">SPAM</div>
  <div class="c" style="top:1060px;font-size:122px;letter-spacing:-5px;${slam(s2)}">BO'LDINGIZMI?</div></div>
 <div class="a" style="left:-100px;top:1290px;width:1300px;height:110px;background:#000;transform:rotate(-4deg) translateX(${L(1300,0,bd)}px);display:flex;align-items:center;overflow:hidden"><div style="white-space:nowrap;font:900 52px I;letter-spacing:2px;color:#FFC93C;transform:translateX(${-u*120}px)">${'AKKAUNT CHEKLANDI · XABAR KETMAYDI · '.repeat(4)}</div></div>
 <div class="L" style="background:#fff;opacity:${fl}"></div>`}],
// 1 messages fail
[3,u=>{const M=['Salom! Narxi qancha?','Buyurtma bermoqchi edim','Javob bering, iltimos'];const st=eo(P(u,.95,1.2));
 return `<div class="L" style="background:#101014"></div><div class="c" style="top:300px;font-size:92px;letter-spacing:-4px;${rise(eo(P(u,0,.4)))}">Xabar ketmayapti.</div>`+
 M.map((m,i)=>{const k=sp(P(u,.15+i*.2,.75+i*.2));return `<div class="a" style="right:150px;top:${520+i*190}px;background:#2B5278;border-radius:44px 44px 10px 44px;padding:34px 44px;font:600 46px I;transform-origin:100% 100%;opacity:${cl(k*3)};transform:scale(${L(.5,1,k)})">${m}</div>
 <div class="a" style="right:56px;top:${548+i*190}px;width:72px;height:72px;border-radius:50%;background:#FF3B30;font:900 46px I;display:flex;align-items:center;justify-content:center;opacity:${cl(k*3)};transform:scale(${L(.2,1,k)})">!</div>`}).join('')+
 `<div class="c" style="top:1140px;${slam(st)}"><span style="display:inline-block;border:10px solid #FF3B30;color:#FF3B30;font:900 120px I;letter-spacing:4px;padding:10px 40px;border-radius:26px;transform:rotate(-8deg);background:rgba(16,16,20,.85)">CHEKLANGAN</span></div>`}],
// 2 solution
[3,u=>{const p=sp(P(u,.1,.9)),t1=eo(P(u,.45,.8)),t2=sp(P(u,.85,1.5));
 return `<div class="L" style="background:linear-gradient(160deg,#35E0C0,#0E9E83 55%,#06604f)"></div>
 <div class="c" style="top:300px;font-size:270px;letter-spacing:-12px;color:rgba(255,255,255,.16);transform:translateX(${L(80,-40,eo(P(u,0,1.8)))}px)">YECHIM</div>
 <img class="a" src="${IMG('ios_044')}" style="left:320px;top:480px;width:440px;transform:scale(${L(.3,1,p)}) rotate(${L(-30,6,p)}deg);filter:drop-shadow(0 50px 60px rgba(0,0,0,.35))">
 <div class="c" style="top:1010px;font-size:118px;letter-spacing:-5px;${rise(t1)}">Tayyor akkaunt</div>
 <div class="c" style="top:1190px;opacity:${cl(t2*3)};transform:scale(${L(.6,1,t2)})"><span class="pill" style="background:#0c0a10;font:900 92px I;letter-spacing:-3px;padding:22px 56px">10 000<span style="font:700 44px I;letter-spacing:0;opacity:.7">so'm</span></span></div>`}],
// 3 countries
[3,u=>{const row=(y,dir,off)=>`<div class="a" style="left:0;top:${y}px;white-space:nowrap;transform:translateX(${dir>0?-900+u*150+off:-200-u*150-off}px)">${[...FLAGS,...FLAGS,...FLAGS].map(([f,n])=>`<span class="pill" style="background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.16);font:800 50px I;padding:22px 40px 22px 26px;margin-right:22px"><img src="${FLG(f)}" style="width:72px">${n}</span>`).join('')}</div>`;
 const k=eo(P(u,0,.4)),m=sp(P(u,.7,1.4));
 return `<div class="L" style="background:radial-gradient(80% 50% at 50% 30%,#1c2a44,#0b0f18 70%)"></div>
 <div class="c" style="top:300px;font-size:104px;letter-spacing:-5px;${rise(k)}">Turli davlat<br>raqamlari</div>
 <div style="opacity:${eo(P(u,.15,.5))}">${row(640,1,0)}${row(800,-1,160)}${row(960,1,330)}</div>
 <div class="c" style="top:1210px;opacity:${cl(m*3)};transform:scale(${L(.6,1,m)})"><span class="pill" style="background:#34c759;font:900 84px I;letter-spacing:-2px;padding:18px 54px">Mavjud ✓</span></div>`}],
// 4 steps
[3,u=>{const R=['Sotib oling','SMS kodni oling','Kiring'];
 return `<div class="L" style="background:#F6F0E8"></div><div class="a" style="left:60px;top:186px;display:flex;align-items:center;gap:14px;font:800 30px I;letter-spacing:2px;color:#3A1F16"><img src="../../brand/logo_terracotta.svg" style="width:50px">STARSFUEL</div>`+
 R.map((r,i)=>{const k=eo(P(u,.1+i*.3,.55+i*.3));return `<div class="a" style="left:70px;top:${330+i*330}px;display:flex;align-items:center;gap:40px;opacity:${cl(k*2)};transform:translateX(${L(-260,0,k)}px)">
  <div style="font:900 330px I;letter-spacing:-14px;line-height:.9;color:#B06750;width:220px">${i+1}</div><div style="font:900 88px I;letter-spacing:-4px;color:#1d120d;line-height:1">${r}</div></div>`}).join('')+
 `<div class="c" style="top:1360px;${rise(eo(P(u,1.1,1.4)),20)}"><span class="pill" style="background:#3A1F16;color:#FBF4EE;font:700 36px I;padding:16px 36px">SMS kod 1 marta beriladi</span></div>`}],
// 5 phone accounts
[4,u=>phone('account.png',u,2.4,-24,10,'AKKAUNT','linear-gradient(160deg,#EC5A9A,#7a2a8e 60%,#2a0f3a)')],
// 6 UC?
[2,u=>{const a=eo(P(u,0,.28)),b=eo(P(u,.3,.55)),c=eo(P(u,.6,.85));
 return `<div class="L" style="background:#FFC93C"></div><div class="c" style="top:360px;font-size:640px;letter-spacing:-34px;color:#0c0a10;${slam(a)}">UC</div>
 <div class="c" style="top:960px;font-size:188px;letter-spacing:-9px;color:#0c0a10;${slam(b)}">KERAKMI?</div>
 <div class="c" style="top:1220px;font-size:70px;font-weight:800;color:#5a3d00;${rise(c,20)}">Almaz? · Diamond?</div>`}],
// 7 game bands
[3,u=>{const G=[['PUBG MOBILE','UC','linear-gradient(90deg,#12131c,#3a3f5c)','#FFC93C'],['FREE FIRE','ALMAZ','linear-gradient(90deg,#c2410c,#ff8a3d)','#fff'],['MLBB','DIAMOND','linear-gradient(90deg,#1E4FE0,#5CC8FF)','#fff']];
 return `<div class="L" style="background:#0c0a10"></div>`+G.map(([g,n,bg,c],i)=>{const k=eo(P(u,.05+i*.22,.5+i*.22)),f=sp(P(u,.5+i*.22,1.1+i*.22));const d=i%2?1:-1;
  return `<div class="a" style="left:0;top:${290+i*410}px;width:1080px;height:390px;background:${bg};transform:translateX(${L(d*1100,0,k)}px);padding:54px 64px">
   <div style="font:800 40px I;letter-spacing:6px;opacity:.75">${g}</div><div style="font:900 190px I;letter-spacing:-9px;line-height:1.05;color:${c}">${n}</div>
   <div class="pill" style="position:absolute;right:56px;top:54px;background:#34c759;font:900 40px I;padding:10px 30px;opacity:${cl(f*3)};transform:scale(${L(.4,1,f)})">FAOL</div></div>`}).join('')}],
// 8 MLBB prices
[4,u=>{const R=[['55 Diamond 2x',9967],['78+8 Diamond',15716],['165 Diamond 2x',29872],['275 Diamond 2x',47927]];
 return `<div class="L" style="background:linear-gradient(170deg,#3B7BFF,#1436a8 55%,#0a1650)"></div>
 <div class="c" style="top:300px;font-size:120px;letter-spacing:-6px;${rise(eo(P(u,0,.4)))}">MLBB narxlari</div>
 <div class="c" style="top:440px;font-size:44px;font-weight:700;letter-spacing:6px;opacity:${.7*eo(P(u,.2,.5))}">UZ / GLOBAL</div>`+
 R.map(([n,v],i)=>{const k=eo(P(u,.3+i*.16,.7+i*.16));return `<div class="a" style="left:60px;top:${560+i*215}px;width:960px;height:185px;border-radius:44px;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.2);display:flex;align-items:center;gap:26px;padding:0 44px 0 30px;${rise(k,60)}">
  <img src="${IMG('ios_094')}" style="width:110px"><div style="flex:1;font:800 50px I;letter-spacing:-1px">${n}</div><div style="font:900 74px I;letter-spacing:-3px">${fmt(v*eo(P(u,.3+i*.16,1.4+i*.12)))}<span style="font:700 32px I;letter-spacing:0;opacity:.7;margin-left:8px">so'm</span></div></div>`}).join('')}],
// 9 phone games
[4,u=>phone('games.png',u,2.4,22,-10,'DONAT','linear-gradient(160deg,#2AABEE,#1b4fb3 55%,#0a1a44)')],
// 10 ready
[2,u=>{const a=eo(P(u,0,.3)),b=eo(P(u,.35,.6));
 return `<div class="L" style="background:radial-gradient(90% 60% at 50% 45%,#5BE584,#22b35a 55%,#0c6b30)"></div>
 <div class="c" style="top:680px;font-size:236px;letter-spacing:-11px;${slam(a)}">TAYYOR!</div>
 <div class="c" style="top:990px;font-size:58px;font-weight:800;${rise(b,20)}">Akkaunt · UC · Almaz · Diamond</div>`}],
// 11 end
[5,u=>{const I2=[['ios_044',150,420,-12],['ios_094',760,400,10],['ios_093',110,1160,8],['ios_077',790,1190,-10],['ios_070',450,1350,6]];const k=eo(P(u,.1,.6)),b=sp(P(u,.6,1.3));
 return `<div class="L" style="background:radial-gradient(70% 45% at 50% 45%,#3a1f5c,#0c0a10 75%)"></div>`+
 I2.map(([n,x,y,r],i)=>{const f=eo(P(u,.05+i*.08,.7+i*.08));return `<img class="a" src="${IMG(n)}" style="left:${L(540+(x-540)*3.2,x,f)}px;top:${L(860+(y-860)*3.2,y,f)}px;width:180px;transform:rotate(${r}deg);filter:drop-shadow(0 30px 40px rgba(0,0,0,.5))">`}).join('')+
 `<div class="c" style="top:560px;${slam(k)}"><img src="../../brand/logo.svg" style="width:190px"></div>
 <div class="c" style="top:790px;font-size:176px;letter-spacing:-9px;${slam(k)}">StarsFuel</div>
 <div class="c" style="top:1010px;opacity:${cl(b*3)};transform:scale(${L(.6,1,b)})"><span class="pill" style="background:#2AABEE;font:900 68px I;letter-spacing:-2px;padding:22px 56px;box-shadow:0 24px 60px rgba(42,171,238,.5)">@StarsFuelApp</span></div>`}],
];
const NB=[];{let b=0;S.forEach(x=>{NB.push([b*BT,(b+x[0])*BT]);b+=x[0]})}
window.seek=t=>{t=Math.min(t,DN-1e-4);const k=NB.findIndex(x=>t>=x[0]&&t<x[1]);const [A,B]=NB[k];let h='';
 const e=k>0?io(P(t,A,A+.3)):1;
 if(e<1){const [pa,pb]=NB[k-1];h+=`<div class="L">${S[k-1][1](pb-pa-.001)}</div>`}
 const circ=k==6||k==10||k==11;const clip=e>=1?'none':circ?`circle(${e*130}% at 50% 50%)`:(k%2?`inset(0 0 0 ${(1-e)*100}%)`:`inset(0 ${(1-e)*100}% 0 0)`);
 h+=`<div class="L" style="clip-path:${clip}">${S[k][1](t-A)}</div>`;
 const st=document.getElementById('st');st.innerHTML=h;const bl=P(t,DN-.3,DN);st.style.filter=bl>0?`blur(${bl*16}px)`:'none';st.style.opacity=1-bl*.6;
 document.getElementById('br').style.opacity=(k==4&&e>.5)||k==11||(k==5&&e<.5)?0:1;
 document.getElementById('br').style.color=k==6?'#0c0a10':'#fff';document.querySelector('#br img').style.filter=k==6?'brightness(0)':'none';
};
const imgs=['ios_052','ios_044','ios_094','ios_093','ios_077','ios_070'].map(IMG).concat(FLAGS.map(f=>FLG(f[0])),[SH+'account.png',SH+'games.png','../../brand/logo.svg','../../brand/logo_terracotta.svg']);
Promise.all([document.fonts.ready,...imgs.map(n=>new Promise(r=>{const im=new Image();im.onload=im.onerror=r;im.src=n}))]).then(()=>{seek(0);window.ready=true});
</script></body></html>
