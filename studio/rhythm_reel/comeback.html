 return `<div class="cap" style="top:${top}px;font-size:${size}px">`+w.map((x,i)=>{const k=eo(P(t,t0+i*dur/n,t0+i*dur/n+.18));const c=Math.round(L(205,17,k));return `<span style="color:rgb(${c},${c},${c});opacity:${L(.0,1,cl(k*3))}">${x}</span>`}).join(' ')+'</div>'}

}

[5.2,6.45,(t,s)=>{const a=eo(P(t,s+.15,s+.45));const c=eo(P(t,s+.25,s+.85));const p=eo(P(t,s+.65,s+.9));

[6.45,7.95,(t,s)=>{const B=[['1 oy',45000],['3 oy',190000],['6 oy',250000],['12 oy',400000]];let h='';
 B.forEach(([l,v],i)=>{const k=eo(P(t,s+.12+i*.1,s+.75+i*.1));const H=330*v/400000*k;const hot=i==0;
  h+=`<div class="ab" style="left:${120+i*210}px;top:130px;width:160px;height:380px">

[9.2,10.45,(t,s)=>{const a=eo(P(t,s+.05,s+.3));const W=["Yangi","akkaunt","uchun","raqam"];
