// I real app: games
[4,(t,s)=>{const y=L(-420,-770,io(P(t,s+.4,s+2.2)));const k=eo(P(t,s+.3,s+.6));

// K end
[5,(t,s)=>{const k=eo(P(t,s,s+.6));const b=eo(P(t,s+.5,s+1));const I2=['ios_044','ios_094','ios_093','ios_077','ios_070'];

const NB=[];{let b=4;S.forEach(x=>{NB.push([b*BT,(b+x[0])*BT]);b+=x[0]})}
